<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>SmallPic - Image Resizer</title>
    <style>
        :root {
            /* iOS System Colors - Dark Mode Base */
            --ios-bg: #000000;
            --ios-card: rgba(30, 30, 35, 0.6);
            --ios-blue: #0a84ff;
            --ios-blue-glass: rgba(10, 132, 255, 0.5);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --radius-l: 16px;
            --radius-xl: 32px;
            --spring: cubic-bezier(0.25, 1, 0.5, 1);

            /* Dynamic Solar Variables */
            --sky-color-1: #141617;
            --sky-color-2: #2d3428;
            --sky-color-3: #7a6332;
            --sky-color-4: #db6b0d;
            --sky-color-5: #1a0b00;
            --sky-color-6: #000000;
            --sky-stop-1: 0%;
            --sky-stop-2: 50%;
            --sky-stop-3: 80%;
            --sky-stop-4: 85%;
            --sky-stop-5: 87.5%;
            --sky-stop-6: 90%;

            --sun-x: 85%;
            --sun-y: 87.5%;
            --sun-color: #ffffff;
            --sun-glow-1: #ffcc33;
            --sun-glow-2: #ff6600;
            --sun-glow-3: rgba(255, 102, 0, 0.6);
            --sun-blur: 6px;

            --horizon-y: 85.5%;
            --horizon-color: rgba(255, 140, 0, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        }

        html {
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
        }

        /* Updated Atmospheric Background */
        body {
            min-height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom);
            background: #000;
            overflow-x: hidden;
        }

        .custom-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 17px;
            width: 100%;
            outline: none;
            font-family: inherit;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }

        .custom-input:focus {
            border-color: var(--ios-blue);
            background: rgba(255, 255, 255, 0.15);
        }

        .sky-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(to bottom,
                    var(--sky-color-1) var(--sky-stop-1),
                    var(--sky-color-2) var(--sky-stop-2),
                    var(--sky-color-3) var(--sky-stop-3),
                    var(--sky-color-4) var(--sky-stop-4),
                    var(--sky-color-5) var(--sky-stop-5),
                    var(--sky-color-6) var(--sky-stop-6));
            overflow: hidden;
        }

        .sun {
            position: absolute;
            top: var(--sun-y);
            left: var(--sun-x);
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: var(--sun-color);
            border-radius: 50%;
            box-shadow:
                0 0 40px var(--sun-color),
                0 0 70px var(--sun-glow-1),
                0 0 120px var(--sun-glow-2),
                0 0 200px var(--sun-glow-3);
            filter: blur(var(--sun-blur));
        }

        .horizon-glow {
            position: absolute;
            top: var(--horizon-y);
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, transparent, var(--horizon-color), transparent);
            filter: blur(8px);
            transform: translateY(-50%);
        }

        /* Header - Deleted as per request, but keeping back btn style for player */
        .header-back-btn {
            position: fixed;
            top: calc(15px + env(safe-area-inset-top));
            left: 20px;
            background: rgba(40, 60, 80, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1001;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .header-back-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .container {
            min-height: 100dvh;
            padding: 20px 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Vertical Centering */
            gap: 24px;
        }

        /* Upload Area */
        .upload-card {
            width: 93%;
            height: 60dvh;
            /* 80% of device screen height */
            background: rgba(30, 35, 45, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            /* Slightly more rounded for large card */
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            cursor: pointer;
            transition: transform 0.2s var(--spring), background 0.2s var(--spring), border-color 0.2s var(--spring);
            padding: 40px;
            box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.4);
            /* Prevent image/text drag-selection */
            -webkit-user-drag: none;
        }

        .upload-card:active {
            transform: scale(0.96);
            background: rgba(50, 50, 55, 0.4);
            border-color: rgba(255, 255, 255, 0.4);
            transition: transform 0.1s var(--spring);
        }

        .upload-icon {
            font-size: 48px;
            background: linear-gradient(135deg, var(--ios-blue), #64d2ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 12px rgba(10, 132, 255, 0.3));
        }

        .upload-text {
            font-size: 19px;
            font-weight: 600;
            color: white;
        }

        #imageInput {
            display: none;
        }

        /* Preview Area */
        .preview-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border-radius: var(--radius-xl);
            overflow: hidden;
            display: none;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
            margin-bottom: 100px;
            /* Space for Save Area */
        }

        #previewImage {
            display: none;
        }

        .preview-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .thumbnail-container {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .filename {
            font-size: 16px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .filesize {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .resize-controls {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(20, 20, 30, 0.2);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
        }

        .preset-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s var(--spring);
        }

        .preset-btn.active {
            background: var(--ios-blue);
            border-color: var(--ios-blue);
        }

        .format-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .format-btn {
            flex: 1;
            min-width: 60px;
            padding: 12px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s var(--spring);
            text-align: center;
        }

        .format-btn.active {
            border-color: white;
            box-shadow: 0 0 15px currentColor;
        }

        /* Pastel Colors */
        .btn-jpeg {
            color: #ffb7b2;
        }

        /* Pastel Red/Pink */
        .btn-png {
            color: #b2e2f2;
        }

        /* Pastel Blue */
        .btn-jxl {
            color: #b2f2bb;
        }

        /* Pastel Green */
        .btn-heif {
            color: #f2e2b2;
        }

        /* Pastel Yellow/Gold */

        .format-btn.active.btn-jpeg {
            background: rgba(255, 183, 178, 0.3);
        }

        .format-btn.active.btn-png {
            background: rgba(178, 226, 242, 0.3);
        }

        .format-btn.active.btn-jxl {
            background: rgba(178, 242, 187, 0.3);
        }

        .format-btn.active.btn-heif {
            background: rgba(242, 226, 178, 0.3);
        }

        .custom-input-group {
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.12);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--ios-blue);
            margin-top: 8px;
            animation: slideDown 0.3s var(--spring);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quality-slider-container {
            display: none;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .size-estimate {
            font-weight: 700;
            color: var(--ios-blue);
        }

        /* Canvas (Hidden Frame Grabber) */
        #canvas {
            display: none;
        }



        /* Floating action button area for save */
        .save-area {
            position: fixed;
            bottom: max(30px, env(safe-area-inset-bottom));
            left: 20px;
            right: 20px;
            z-index: 100;
        }

        .save-btn {
            width: 100%;
            padding: 18px;
            /* 3D Glassy Blue Match */
            background: linear-gradient(180deg, rgba(10, 132, 255, 0.7) 0%, rgba(10, 132, 255, 0.5) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(150, 200, 255, 0.3);
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 10px 30px -5px rgba(10, 132, 255, 0.5);
            display: none;
            /* Hidden until frame selected */
            transition: transform 0.2s var(--spring);
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        .quality-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        .quality-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .instructions {
            font-size: 15px;
            color: var(--text-secondary);
            text-align: center;
            max-width: 300px;
            line-height: 1.5;
            font-weight: 400;
        }
    </style>
</head>

<body>

    <!-- Atmospheric Sky Background -->
    <div class="sky-container">
        <div class="sun"></div>
        <div class="horizon-glow"></div>
    </div>
    <button class="header-back-btn" id="backBtn" onclick="resetApp()">
        <svg viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
        </svg>
    </button>

    <div class="container">
        <!-- Upload -->
        <div class="upload-card" onclick="document.getElementById('imageInput').click()">
            <div class="upload-icon">⏏</div>
            <div class="upload-text">Tap to Select Image</div>
            <div class="instructions">Choose any image to resize and convert for your iOS device.</div>
            <input type="file" id="imageInput" accept="image/png, image/jpeg">
        </div>

        <!-- Image Preview & Controls -->
        <div class="preview-container" id="previewContainer">
            <div class="preview-header">
                <div class="thumbnail-container">
                    <img id="thumbnail" class="thumbnail">
                </div>
                <div class="image-info">
                    <div id="filenameDisplay" class="filename">filename.jpg</div>
                    <div id="origSizeDisplay" class="filesize">0 KB</div>
                </div>
            </div>
            <img id="previewImage" style="display: none;">

            <div class="resize-controls">
                <!-- Size Preset Selection -->
                <div class="control-group">
                    <div class="control-label">Resize Preset</div>
                    <div class="preset-buttons">
                        <button class="preset-btn" onclick="setPreset('low')">Low</button>
                        <button class="preset-btn" onclick="setPreset('medium')">Med</button>
                        <button class="preset-btn" onclick="setPreset('high')">High</button>
                        <button class="preset-btn" onclick="setPreset('custom')">Custom</button>
                    </div>
                </div>

                <!-- Custom Dimension Input -->
                <div id="customDimGroup" style="display: none; margin-top: -10px;">
                    <div class="custom-input-group"
                        style="display: block; border: none; background: transparent; padding: 0;">
                        <input type="number" id="customDim" class="custom-input" placeholder="Enter longest edge px..."
                            oninput="updateEstimate()">
                    </div>
                </div>

                <!-- Format Selection -->
                <div class="control-group">
                    <div class="control-label">Export Format</div>
                    <div class="format-buttons">
                        <button class="format-btn btn-jpeg active" onclick="setFormat('image/jpeg')">JPEG</button>
                        <button class="format-btn btn-png" onclick="setFormat('image/png')">PNG</button>
                        <button class="format-btn btn-jxl" onclick="setFormat('image/jxl')">JXL</button>
                        <button class="format-btn btn-heif" onclick="setFormat('image/heif')">HEIF</button>
                    </div>
                </div>

                <!-- Quality Slider (JPEG Only) -->
                <div class="control-group quality-slider-container" id="qualityContainer">
                    <div class="info-row">
                        <div class="control-label">Quality</div>
                        <div id="qualityValue">85%</div>
                    </div>
                    <input type="range" id="qualitySlider" class="quality-slider" min="1" max="100" value="85"
                        oninput="updateQualityLabel(); updateEstimate();">
                </div>

                <!-- Info and Estimate -->
                <div class="control-group">
                    <div class="info-row">
                        <span>New Dimensions:</span>
                        <span id="newDimDisplay">0 x 0</span>
                    </div>
                    <div class="info-row" style="margin-top: 8px;">
                        <span>Estimated File Size:</span>
                        <span class="size-estimate" id="estimateDisplay">Calculating...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="save-area">
        <button class="save-btn" id="saveBtn" onclick="downloadImage()">Download Small Pic</button>
    </div>

    <script>


        /* Dynamic Atmosphere System */
        function updateAtmosphere() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const currentTime = hours + minutes / 60;

            // Sunrise/Sunset at 6am/6pm (6 and 18)
            // Midday at 12pm (12)

            // We want t=0 at 6am/6pm and t=1 at 12pm
            let t = 0;
            if (currentTime >= 6 && currentTime <= 18) {
                // Calculate distance from 12pm (range is 6 to 18, peak at 12)
                t = 1 - Math.abs(currentTime - 12) / 6;
            } else {
                // Night time (simplified: stay at t=0 or go even darker if we wanted)
                t = 0;
            }

            // Interpolation helper
            const lerpColor = (c1, c2, f) => {
                const fixHex = (hex) => {
                    if (hex.length === 4) {
                        return '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
                    }
                    return hex;
                };
                const hex1 = fixHex(c1);
                const hex2 = fixHex(c2);

                const r1 = parseInt(hex1.substring(1, 3), 16);
                const g1 = parseInt(hex1.substring(3, 5), 16);
                const b1 = parseInt(hex1.substring(5, 7), 16);
                const r2 = parseInt(hex2.substring(1, 3), 16);
                const g2 = parseInt(hex2.substring(3, 5), 16);
                const b2 = parseInt(hex2.substring(5, 7), 16);

                const r = Math.round(r1 + (r2 - r1) * f);
                const g = Math.round(g1 + (g2 - g1) * f);
                const b = Math.round(b1 + (b2 - b1) * f);

                const toHex = (num) => Math.max(0, Math.min(255, num)).toString(16).padStart(2, '0');
                return '#' + toHex(r) + toHex(g) + toHex(b);
            };

            const root = document.documentElement;

            // Define states
            const horizon = {
                sky: ['#141617', '#2d3428', '#7a6332', '#db6b0d', '#1a0b00', '#000000'],
                stops: ['0%', '50%', '80%', '85%', '87.5%', '90%'],
                sunX: '85%', sunY: '87.5%', sunBlur: '6px',
                sunColor: '#ffffff', glow1: '#ffcc33', glow2: '#ff6600', glow3: 'rgba(255, 102, 0, 0.6)',
                horizonY: '85.5%', horizonColor: 'rgba(255, 140, 0, 0.8)'
            };

            const midday = {
                sky: ['#0a2e5c', '#1e5799', '#7db9e8', '#ffffff', '#000000', '#000000'],
                stops: ['0%', '30%', '70%', '85%', '85.1%', '90%'],
                sunX: '50%', sunY: '25%', sunBlur: '2px',
                sunColor: '#ffffff', glow1: '#ffffff', glow2: '#e0f0ff', glow3: 'rgba(255, 255, 255, 0.3)',
                horizonY: '85%', horizonColor: 'rgba(255, 255, 255, 0.4)'
            };

            // Apply interpolated values
            for (let i = 0; i < 6; i++) {
                root.style.setProperty(`--sky-color-${i + 1}`, lerpColor(horizon.sky[i], midday.sky[i], t));
                root.style.setProperty(`--sky-stop-${i + 1}`, (parseFloat(horizon.stops[i]) + (parseFloat(midday.stops[i]) - parseFloat(horizon.stops[i])) * t) + '%');
            }

            root.style.setProperty('--sun-x', (parseFloat(horizon.sunX) + (parseFloat(midday.sunX) - parseFloat(horizon.sunX)) * t) + '%');
            root.style.setProperty('--sun-y', (parseFloat(horizon.sunY) + (parseFloat(midday.sunY) - parseFloat(horizon.sunY)) * t) + '%');
            root.style.setProperty('--sun-blur', (parseFloat(horizon.sunBlur) + (parseFloat(midday.sunBlur) - parseFloat(horizon.sunBlur)) * t) + 'px');

            root.style.setProperty('--horizon-y', (parseFloat(horizon.horizonY) + (parseFloat(midday.horizonY) - parseFloat(horizon.horizonY)) * t) + '%');

            // Colors and RGBA are trickier to lerp perfectly but let's do the basics
            root.style.setProperty('--sun-color', lerpColor(horizon.sunColor, midday.sunColor, t));
            root.style.setProperty('--sun-glow-1', lerpColor(horizon.glow1, midday.glow1, t));
            root.style.setProperty('--sun-glow-2', lerpColor(horizon.glow2, midday.glow2, t));
            // simplified alpha lerp for glow 3
            root.style.setProperty('--sun-glow-3', t > 0.5 ? midday.glow3 : horizon.glow3);
            root.style.setProperty('--horizon-color', t > 0.5 ? midday.horizonColor : horizon.horizonColor);
        }

        // Initialize and update every minute
        window.addEventListener('load', () => {
            updateAtmosphere();
            setInterval(updateAtmosphere, 60000);
        });

        /* App Logic */
        const imageInput = document.getElementById('imageInput');
        const previewImage = document.getElementById('previewImage');
        const previewContainer = document.getElementById('previewContainer');
        const uploadCard = document.querySelector('.upload-card');
        const formatSelect = document.getElementById('formatSelect');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityContainer = document.getElementById('qualityContainer');
        const qualityValue = document.getElementById('qualityValue');
        const customDimGroup = document.getElementById('customDimGroup');
        const customDimInput = document.getElementById('customDim');
        const newDimDisplay = document.getElementById('newDimDisplay');
        const estimateDisplay = document.getElementById('estimateDisplay');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const saveBtn = document.getElementById('saveBtn');
        const backBtn = document.getElementById('backBtn');

        let originalImage = new Image();
        let originalFile = null;
        let selectedPreset = 'high';
        let selectedFormat = 'image/jpeg';
        let currentBlobUrl = null;

        imageInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                originalFile = file;
                const reader = new FileReader();
                reader.onload = function (event) {
                    originalImage.src = event.target.result;
                    originalImage.onload = function () {
                        previewImage.src = originalImage.src;
                        document.getElementById('thumbnail').src = originalImage.src;
                        document.getElementById('filenameDisplay').textContent = file.name;
                        origSizeDisplay.textContent = formatBytes(file.size);

                        // Show controls
                        uploadCard.style.display = 'none';
                        previewContainer.style.display = 'flex';
                        saveBtn.style.display = 'block';
                        backBtn.style.display = 'flex';

                        setPreset('high'); // Default to original
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function setPreset(preset) {
            selectedPreset = preset;

            // Update UI
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase() === preset || (preset === 'medium' && btn.innerText === 'Med')) {
                    btn.classList.add('active');
                }
            });

            if (preset === 'custom') {
                customDimGroup.style.display = 'flex';
            } else {
                customDimGroup.style.display = 'none';
            }
            updateEstimate();
        }

        function updateQualityLabel() {
            qualityValue.textContent = qualitySlider.value + '%';
        }

        function setFormat(format) {
            selectedFormat = format;

            // Update UI
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase() === format.split('/')[1] ||
                    (format === 'image/jpeg' && btn.innerText === 'JPEG')) {
                    btn.classList.add('active');
                }
            });

            toggleQualitySlider();
            updateEstimate();
        }

        function toggleQualitySlider() {
            if (selectedFormat === 'image/jpeg') {
                qualityContainer.style.display = 'flex';
            } else {
                qualityContainer.style.display = 'none';
            }
        }

        function updateQualityLabel() {
            qualityValue.textContent = qualitySlider.value + '%';
        }

        function calculateDimensions() {
            let width = originalImage.width;
            let height = originalImage.height;
            const isLandscape = width >= height;

            let targetLongest;
            switch (selectedPreset) {
                case 'low': targetLongest = 640; break;
                case 'medium': targetLongest = 1280; break;
                case 'high': targetLongest = Math.max(width, height); break;
                case 'custom': targetLongest = parseInt(customDimInput.value) || Math.max(width, height); break;
            }

            if (isLandscape) {
                if (width > targetLongest || selectedPreset !== 'high') {
                    const ratio = targetLongest / width;
                    width = targetLongest;
                    height = height * ratio;
                }
            } else {
                if (height > targetLongest || selectedPreset !== 'high') {
                    const ratio = targetLongest / height;
                    height = targetLongest;
                    width = width * ratio;
                }
            }

            return { width: Math.round(width), height: Math.round(height) };
        }

        async function updateEstimate() {
            if (!originalFile) return;

            const dims = calculateDimensions();
            newDimDisplay.textContent = `${dims.width} x ${dims.height}`;
            estimateDisplay.textContent = "Calculating...";

            // To estimate size, we actually render it to a blob (debounced would be better but for small-ish images it's fine)
            // debouncing estimation
            clearTimeout(window.estTimeout);
            window.estTimeout = setTimeout(async () => {
                canvas.width = dims.width;
                canvas.height = dims.height;
                ctx.drawImage(originalImage, 0, 0, dims.width, dims.height);

                const format = selectedFormat;
                const quality = qualitySlider.value / 100;

                try {
                    canvas.toBlob((blob) => {
                        if (blob) {
                            estimateDisplay.textContent = formatBytes(blob.size);
                        } else {
                            estimateDisplay.textContent = "Error estimating";
                        }
                    }, format, format === 'image/jpeg' ? quality : undefined);
                } catch (e) {
                    estimateDisplay.textContent = "Format unsupported";
                }
            }, 300);
        }

        function downloadImage() {
            const dims = calculateDimensions();
            canvas.width = dims.width;
            canvas.height = dims.height;
            ctx.drawImage(originalImage, 0, 0, dims.width, dims.height);

            const format = selectedFormat;
            const quality = qualitySlider.value / 100;
            const extension = format.split('/')[1].replace('jpeg', 'jpg');

            canvas.toBlob(function (blob) {
                if (!blob) {
                    alert("Failed to export in this format. The browser might not support it.");
                    return;
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                a.download = `smallpic_${timestamp}.${extension}`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            }, format, format === 'image/jpeg' ? quality : undefined);
        }

        function resetApp() {
            imageInput.value = "";
            previewContainer.style.display = 'none';
            uploadCard.style.display = 'flex';
            saveBtn.style.display = 'none';
            backBtn.style.display = 'none';
            originalFile = null;
        }

        // Clean up
        window.addEventListener('beforeunload', () => {
            // No blobs to cleanup yet but good practice
        });
    </script>
</body>
