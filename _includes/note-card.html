<!-- Footnote / Note cards (shared across all posts) -->
<style>
  .note-card {
    border: 1px solid var(--note-card-border);
    border-radius: 8px;
    margin: 2rem 0;
    background: var(--note-card-bg);
  }
  .note-card summary {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    font-size: 0.78em;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    list-style: none;
    user-select: none;
    color: var(--note-card-summary);
  }
  .note-card summary::-webkit-details-marker { display: none; }
  .note-card summary::before {
    content: '▸';
    font-size: 0.9em;
    transition: transform 0.25s ease;
    display: inline-block;
  }
  .note-card[open] summary::before { transform: rotate(90deg); }
  /* Animated expand/collapse via CSS grid 0fr -> 1fr */
  .note-card-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.3s ease;
  }
  .note-card[open] .note-card-body {
    grid-template-rows: 1fr;
  }
  .note-card.is-closing .note-card-body {
    grid-template-rows: 0fr;
  }
  .note-card-body-inner {
    overflow: hidden;
    padding: 0 1rem;
    border-top: 1px solid var(--note-card-border);
    font-size: 0.9em;
    color: var(--note-card-body);
    transition: padding 0.3s ease;
  }
  .note-card[open] .note-card-body-inner {
    padding-top: 0.6rem;
    padding-bottom: 0.75rem;
  }
  .note-card.is-closing .note-card-body-inner {
    padding-top: 0;
    padding-bottom: 0;
  }
  .note-card-body-inner p {
    margin: 0.5rem 0;
    line-height: 1.5;
  }
  .note-card-body-inner ul { margin: 0; padding-left: 1.3em; }
  .note-card-body-inner li { margin: 0.4rem 0; }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Auto-wrap each card body so the grid animation has an overflow-hidden
    // inner element (skips bodies that are already wrapped).
    document.querySelectorAll('.note-card .note-card-body').forEach(function (body) {
      if (body.firstElementChild && body.firstElementChild.classList.contains('note-card-body-inner')) return;
      var inner = document.createElement('div');
      inner.className = 'note-card-body-inner';
      while (body.firstChild) inner.appendChild(body.firstChild);
      body.appendChild(inner);
    });

    document.querySelectorAll('.note-card summary').forEach(function (summary) {
      summary.addEventListener('click', function (e) {
        e.preventDefault();
        var details = summary.closest('details');
        var y = window.scrollY;

        if (details.open) {
          // Closing: play the 0.3s grid animation before removing [open]
          if (details.classList.contains('is-closing')) return;
          details.classList.add('is-closing');
          setTimeout(function () {
            details.open = false;
            details.classList.remove('is-closing');
            requestAnimationFrame(function () {
              requestAnimationFrame(function () { window.scrollTo(0, y); });
            });
          }, 300);
        } else {
          details.open = true;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { window.scrollTo(0, y); });
          });
        }
      });
    });
  });
</script>
