---
layout: default
---
<h1>#{{ page.tag }}</h1>

{% assign tagged_posts = site.posts | where_exp: "post", "post.tags contains page.tag" %}

<ul class="blog">
  {% for post in tagged_posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a> ({{ post.date | date: "%d %b %Y" }})
  </li>
  {% endfor %}
</ul>
