<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
  <script>
    // Apply saved theme immediately to avoid flash
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  {% if page.accent_color %}
  <style>
    :root {
      --accent-color: {{ page.accent_color }};
    }
    body {
      background-color: var(--bg);
      background-image: linear-gradient(
        to bottom,
        color-mix(in srgb, var(--accent-color) 50%, var(--bg)) 0%,
        var(--bg) min(50%, 1000px)
      );
      background-repeat: no-repeat;
    }
  </style>
  {% endif %}
</head>
<body>
<main>
<button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle dark/light mode"></button>
{{ content }}
</main>
{% include footer.html %}
<script>
  (function() {
    var btn = document.getElementById('theme-toggle');
    btn.addEventListener('click', function() {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme');
      var isDarkOS = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (!current) {
        // First click: override to opposite of OS preference
        html.setAttribute('data-theme', isDarkOS ? 'light' : 'dark');
      } else if (current === 'dark') {
        html.setAttribute('data-theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
      }
      localStorage.setItem('theme', html.getAttribute('data-theme'));
    });
  })();
</script>
</body>
</html>
