    <script>
        // ── THEME TOGGLE ─────────────────────────────────────────────
        if (localStorage.getItem('theme') === 'light' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.add('light-mode');
        }

        window.toggleLayout = function() {
            const layout = document.querySelector('.layout');
            layout.classList.toggle('is-grid-view');
            const isGrid = layout.classList.contains('is-grid-view');
            document.getElementById('grid-icon').style.display = isGrid ? 'none' : 'block';
            document.getElementById('list-icon').style.display = isGrid ? 'block' : 'none';
        }

        window.toggleTheme = function () {
            const root = document.documentElement;
            root.classList.toggle('light-mode');
            const isLight = root.classList.contains('light-mode');
            document.getElementById('moon-icon').style.display = isLight ? 'none' : 'block';
            document.getElementById('sun-icon').style.display = isLight ? 'block' : 'none';

            if (activeCategory) applyFilters();
            if (currentTestName) openTest(currentTestName);

            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        };

        document.addEventListener('DOMContentLoaded', () => {
            const isLight = document.documentElement.classList.contains('light-mode');
            document.getElementById('moon-icon').style.display = isLight ? 'none' : 'block';
            document.getElementById('sun-icon').style.display = isLight ? 'block' : 'none';
        });

        // ── DATA & STATE ──────────────────────────────────────────────
        let allTests = [];          // [{name, unit, range, type, dataPoints:[{date,value,rawResult,rawRange}]}]
        let filteredTests = [];
        let activeCategory = 'All';
        let currentTestName = null;
        let currentChart = null;
        let sparklineCharts = {};   // id -> Chart instance (for cleanup)

        // Qualitative result normalization
        const QUAL_NEGATIVE = ['nonreactive', 'negative', 'notdetected', 'nondetected', 'undetected', 'absent', 'none'];
        const QUAL_POSITIVE = ['reactive', 'positive', 'detected', 'present'];

        function qualStatus(result) {
            if (!result) return 'unknown';
            // Strip spaces and hyphens so "Non-Reactive" becomes "nonreactive"
            const r = String(result).toLowerCase().replace(/[\s-]/g, '');
            // Always check negative strictly first. "nonreactive" contains "reactive".
            if (QUAL_NEGATIVE.some(k => r.includes(k))) return 'clear';
            if (QUAL_POSITIVE.some(k => r.includes(k))) return 'reactive';
            return 'unknown';
        }

        // Category taxonomy
        const CATEGORIES = {
            'STDs': [
                'HIV', 'HEPATITIS', 'SYPHILIS', 'CHLAMYDIA', 'GONORRHEA', 'HSV', 'TRICHOMONAS', 'SYPHILIS'
            ],
            'Hormones': [
                'TESTOSTERONE', 'TSH', 'FREE T4', 'T3', 'DHEA', 'CORTISOL', 'ESTROGEN', 'PROGESTERONE', 'LH', 'FSH'
            ],
            'Metabolic': [
                'GLUCOSE', 'HBA1C', 'HEMOGLOBIN A1C', 'INSULIN', 'TRIGLYCERIDES', 'CHOLESTEROL', 'HDL', 'LDL'
            ],
            'Liver': [
                'ALT', 'AST', 'ALKALINE PHOSPHATASE', 'BILIRUBIN', 'ALBUMIN', 'TOTAL PROTEIN', 'GLOBULIN', 'A/G RATIO'
            ],
            'Kidney': [
                'CREATININE', 'BUN', 'GFR', 'B/C RATIO', 'URINE'
            ],
            'CBC': [
                'WBC', 'RBC', 'HGB', 'HCT', 'MCV', 'MCH', 'MCHC', 'PLT', 'RDW', 'NEU', 'LYMPH', 'MONO', 'EOS', 'BASO', 'IMMGRN', 'MPV', 'NRBC'
            ],
            'Electrolytes': [
                'SODIUM', 'POTASSIUM', 'CHLORIDE', 'CO2', 'CALCIUM', 'PHOSPHATE', 'MAGNESIUM'
            ],
            'Vitamins': [
                'VIT', 'VITAMIN', 'ZINC', 'IRON', 'FERRITIN', 'B12', 'FOLATE'
            ],
        };

        function categorize(name) {
            const n = name.toUpperCase();
            for (const [cat, keywords] of Object.entries(CATEGORIES)) {
                if (keywords.some(k => n.includes(k))) return cat;
            }
            return 'Other';
        }

        function cleanNumber(str) {
            if (str === null || str === undefined) return null;
            const s = String(str).replace(/[<>^=\s]/g, '').replace(/[^0-9.\-]/g, '');
            const n = parseFloat(s);
            return isNaN(n) ? null : n;
        }

        function parseRange(rangeStr) {
            if (!rangeStr || typeof rangeStr !== 'string') return null;
            const r = rangeStr.trim();
            // "min-max" - careful with negative numbers
            const dash = r.match(/^([0-9.]+)\s*-\s*([0-9.]+)$/);
            if (dash) return { min: parseFloat(dash[1]), max: parseFloat(dash[2]) };
            // "<X" or "<=X"
            const lt = r.match(/^<=?\s*([0-9.]+)$/);
            if (lt) return { max: parseFloat(lt[1]) };
            // ">X" or ">=X"
            const gt = r.match(/^>=?\s*([0-9.]+)$/);
            if (gt) return { min: parseFloat(gt[1]) };
            return null;
        }

        function isInRange(val, parsed) {
            if (!parsed) return null;
            if (parsed.min !== undefined && val < parsed.min) return 'low';
            if (parsed.max !== undefined && val > parsed.max) return 'high';
            return 'normal';
        }

        // ── LOAD DATA ────────────────────────────────────────────────
        async function loadData() {
            try {
                const resp = await fetch('./Blood_Tests_updated-2026-04-11-2242.json');
                const raw = await resp.json();

                const grouped = {};
                raw.forEach(item => {
                    const name = item.TestName;
                    if (!grouped[name]) grouped[name] = { name, unit: null, range: null, points: [] };

                    const numVal = cleanNumber(item.Result);
                    const isNum = item['IsNumeric?'] === 1 || item['IsNumeric?'] === '1';

                    // Pick up unit & range (first non-null)
                    if (item.Units && !grouped[name].unit) grouped[name].unit = item.Units;
                    if (item.NormalRange && !grouped[name].range) grouped[name].range = String(item.NormalRange);

                    grouped[name].points.push({
                        date: item.Date,
                        rawResult: item.Result,
                        numVal: (isNum && numVal !== null) ? numVal : ((!isNum && numVal !== null) ? numVal : null),
                        isNumeric: isNum,
                        rawRange: item.NormalRange ? String(item.NormalRange) : null,
                    });
                });

                // Sort by date, dedup (last wins), classify
                allTests = Object.values(grouped).map(g => {
                    g.points.sort((a, b) => new Date(a.date) - new Date(b.date));
                    // dedup by date
                    const dmap = {};
                    g.points.forEach(p => { dmap[p.date] = p; });
                    g.points = Object.values(dmap).sort((a, b) => new Date(a.date) - new Date(b.date));

                    // Determine type
                    const numericPts = g.points.filter(p => p.isNumeric && p.numVal !== null);
                    const qualPts = g.points.filter(p => !p.isNumeric);

                    let type = 'numeric';
                    if (numericPts.length === 0 && qualPts.length > 0) type = 'qualitative';
                    else if (numericPts.length > 0 && qualPts.length === 0) type = 'numeric';
                    else type = 'mixed';

                    g.type = type;
                    g.numericPts = numericPts;
                    g.category = categorize(g.name);

                    // Best range string
                    const rp = g.points.find(p => p.rawRange && isNaN(parseFloat(p.rawRange)));
                    if (rp) g.range = rp.rawRange;

                    return g;
                });

                // Sort: most data points first, then alpha
                allTests.sort((a, b) => b.points.length - a.points.length || a.name.localeCompare(b.name));

                buildChips();
                applyFilters();
                document.getElementById('loadingState').remove();

                // Auto-select first test with multiple points on desktop
                if (isDesktop()) {
                    setTimeout(() => {
                        const firstMulti = allTests.find(t => t.numericPts && t.numericPts.length > 1);
                        if (firstMulti) openTest(firstMulti.name);
                        else if (allTests.length > 0) openTest(allTests[0].name);
                    }, 150);
                }

            } catch (e) {
                console.error(e);
                document.getElementById('loadingState').innerHTML = '<span style="color:var(--red)">⚠ Failed to load data</span>';
            }
        }

        // ── CHIPS ────────────────────────────────────────────────────
        function buildChips() {
            const cats = ['All', ...Object.keys(CATEGORIES).filter(c =>
                allTests.some(t => t.category === c)
            ), 'Other'];

            const row = document.getElementById('chipRow');
            row.innerHTML = cats.map(c =>
                `<div class="chip${c === 'All' ? ' active' : ''}" data-cat="${c}" onclick="setCategory(this,'${c}')">${c}</div>`
            ).join('');
        }

        function setCategory(el, cat) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            activeCategory = cat;
            applyFilters();
        }

        // ── FILTER / RENDER LIST ────────────────────────────────────
        function onSearch() { applyFilters(); }

        function applyFilters() {
            const term = document.getElementById('testSearch').value.toLowerCase();
            filteredTests = allTests.filter(t => {
                const catOk = activeCategory === 'All' || t.category === activeCategory;
                const termOk = !term || t.name.toLowerCase().includes(term);
                return catOk && termOk;
            });
            renderList();
        }

        function renderList() {
            const panel = document.getElementById('panelList');

            // Destroy old sparklines
            Object.values(sparklineCharts).forEach(c => { try { c.destroy(); } catch (_) { } });
            sparklineCharts = {};

            // Group by category
            const byCategory = {};
            filteredTests.forEach(t => {
                if (!byCategory[t.category]) byCategory[t.category] = [];
                byCategory[t.category].push(t);
            });

            if (filteredTests.length === 0) {
                panel.innerHTML = '<div class="empty-state">No matching biomarkers</div>';
                return;
            }

            const sections = [];

            // ── HERO WIDGET ──
            const isSearching = document.getElementById('testSearch').value.trim() !== '';
            if (!isSearching && activeCategory === 'All') {
                let totalTestsCount = allTests.length;
                let latestDateStr = '';
                let totalOOR = 0;

                allTests.forEach(t => {
                    if (t.points && t.points.length > 0) {
                        const last = t.points[t.points.length - 1];
                        if (!latestDateStr || last.date > latestDateStr) latestDateStr = last.date;

                        if (t.type === 'qualitative') {
                            if (qualStatus(last.rawResult) === 'reactive') totalOOR++;
                        } else if (t.numericPts.length > 0) {
                            const lastNum = t.numericPts[t.numericPts.length - 1];
                            const rStr = lastNum.rawRange || t.range;
                            const parsed = parseRange(rStr);
                            if (parsed) {
                                const stat = isInRange(lastNum.numVal, parsed);
                                if (stat === 'high' || stat === 'low') totalOOR++;
                            }
                        }
                    }
                });

                sections.push(`
                <div class="hero-widget">
                    <div class="hero-glow"></div>
                    <div class="hero-content">
                        <div class="hero-kpi">
                            <div class="hero-kpi-val" style="color: ${totalOOR > 0 ? 'var(--red)' : 'var(--text)'}">${totalOOR}</div>
                            <div class="hero-kpi-lbl">Out of Range</div>
                        </div>
                        <div class="hero-kpi-divider"></div>
                        <div class="hero-kpi">
                            <div class="hero-kpi-val c-text">${totalTestsCount}</div>
                            <div class="hero-kpi-lbl">Biomarkers</div>
                        </div>
                        <div class="hero-kpi-divider"></div>
                        <div class="hero-kpi">
                            <div class="hero-kpi-val c-text" style="font-size:1.15rem; transform: translateY(2px);">${latestDateStr ? fmtDate(latestDateStr).replace(/,\s*/, '') : 'N/A'}</div>
                            <div class="hero-kpi-lbl">Last Lab</div>
                        </div>
                    </div>
                </div>
                `);
            }

            Object.entries(byCategory).forEach(([cat, tests]) => {
                sections.push(`<div class="section-label">${cat}</div>`);
                tests.forEach(t => {
                    sections.push(renderTestCard(t));
                });
            });

            panel.innerHTML = sections.join('');

            // Draw sparklines
            filteredTests.forEach(t => {
                if (t.type !== 'qualitative' && t.numericPts.length > 1) {
                    drawSparkline(t);
                }
            });
        }

        function renderTestCard(t) {
            const id = safeId(t.name);
            const isCurrent = t.name === currentTestName;
            const last = t.points[t.points.length - 1];

            if (t.type === 'qualitative') {
                // Most-recent status
                const status = qualStatus(last.rawResult);
                const badgeClass = status === 'clear' ? 'badge-green' : status === 'reactive' ? 'badge-red' : 'badge-amber';
                const badgeText = status === 'clear' ? 'CLEAR' : status === 'reactive' ? 'REACTIVE' : 'UNKNOWN';
                const checkCount = t.points.filter(p => qualStatus(p.rawResult) === 'clear').length;

                return `
      <div class="test-card${isCurrent ? ' active-card' : ''}" id="test-btn-${id}" onclick="openTest('${escStr(t.name)}')">
        <div class="test-card-inner">
            <div class="test-card-left">
              <div class="test-card-name">${t.name}</div>
              <div class="test-card-meta">
                <span>${t.points.length} ${t.points.length === 1 ? 'test' : 'tests'}</span>
                <span>${checkCount}/${t.points.length} clear</span>
              </div>
            </div>
            <div class="test-card-right">
              <span class="status-badge ${badgeClass}">${badgeText}</span>
              <span style="font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--muted)">${fmtDate(last.date)}</span>
            </div>
            <svg class="chevron" width="7" height="12" viewBox="0 0 7 12" fill="none">
              <path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
        </div>
      </div>`;
            }

            // Numeric
            const latestNumPt = [...t.numericPts].reverse()[0];
            const latestVal = latestNumPt ? latestNumPt.numVal : null;
            const rangeStr = latestNumPt?.rawRange || t.range;
            const parsed = parseRange(rangeStr);
            const status = latestVal !== null ? isInRange(latestVal, parsed) : null;

            let valColor = 'c-text';
            if (status === 'low' || status === 'high') valColor = 'c-red';
            else if (status === 'normal') valColor = 'c-green';

            const displayVal = latestVal !== null ? formatVal(latestVal) : (last.rawResult ?? '—');

            return `
    <div class="test-card${isCurrent ? ' active-card' : ''}" id="test-btn-${id}" onclick="openTest('${escStr(t.name)}')">
      <div class="test-card-inner">
          <div class="test-card-left">
            <div class="test-card-name">${t.name}</div>
            <div class="test-card-meta">
              <span>${t.numericPts.length} ${t.numericPts.length === 1 ? 'reading' : 'readings'}</span>
              ${rangeStr && typeof rangeStr === 'string' && !isNaN(Number(rangeStr)) === false ? `<span>${rangeStr}</span>` : ''}
            </div>
          </div>
          <div class="test-card-right" style="gap:2px;">
            <div class="latest-chip ${valColor}">${displayVal}</div>
            ${t.numericPts.length > 1 ? `<canvas id="spark-${id}" width="64" height="28" style="display:block;"></canvas>` : ''}
          </div>
          <svg class="chevron" width="7" height="12" viewBox="0 0 7 12" fill="none">
            <path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
      </div>
    </div>`;
        }

        function drawSparkline(t) {
            const id = safeId(t.name);
            const canvas = document.getElementById(`spark-${id}`);
            if (!canvas) return;

            const vals = t.numericPts.map(p => p.numVal);
            const rangeStr = t.numericPts[t.numericPts.length - 1]?.rawRange || t.range;
            const parsed = parseRange(rangeStr);
            const lastStatus = parsed ? isInRange(vals[vals.length - 1], parsed) : null;

            const lineColor = lastStatus === 'normal' ? getCssVar('--green')
                : lastStatus === 'high' || lastStatus === 'low' ? getCssVar('--red')
                    : getCssVar('--accent');

            if (sparklineCharts[id]) {
                try { sparklineCharts[id].destroy(); } catch (_) { }
            }

            try {
                sparklineCharts[id] = new Chart(canvas.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: t.numericPts.map(p => p.date),
                        datasets: [{
                            data: vals,
                            borderColor: lineColor,
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.4,
                            fill: false,
                        }]
                    },
                    options: {
                        animation: false,
                        responsive: false,
                        plugins: { legend: { display: false }, tooltip: { enabled: false } },
                        scales: { x: { display: false }, y: { display: false } },
                    }
                });
            } catch (_) { }
        }

        // ── ACTION SHEET ─────────────────────────────────────────────
        function toggleActionSheet(show) {
            const sheet = document.getElementById('actionSheet');
            const overlay = document.getElementById('actionSheetOverlay');
            if (show) {
                sheet.classList.add('visible');
                overlay.classList.add('visible');
            } else {
                sheet.classList.remove('visible');
                overlay.classList.remove('visible');
            }
        }

        // ── OPEN TEST ────────────────────────────────────────────────
        function isDesktop() { return window.innerWidth >= 900; }

        function getKPIHtml(t) {
            if (t.type === 'qualitative') {
                const last = t.points[t.points.length - 1];
                const s = qualStatus(last.rawResult);
                const lVal = s === 'clear' ? 'CLEAR' : s === 'reactive' ? '⚠ REACTIVE' : '?';
                const lClass = s === 'clear' ? 'c-green' : s === 'reactive' ? 'c-red' : 'c-amber';
                return `
                <div class="kpi-row grid-kpi-row">
                    <div class="kpi-box"><div class="kpi-label">Latest</div><div class="kpi-val ${lClass}">${lVal}</div><div class="kpi-sub" style="margin-top:2px;">${fmtDate(last.date)}</div></div>
                    <div class="kpi-box"><div class="kpi-label">Target Range</div><div class="kpi-val c-text" style="font-size:0.95rem;">Nonreactive</div><div class="kpi-sub" style="margin-top:2px;">Ref. interval</div></div>
                    <div class="kpi-box"><div class="kpi-label">Tests</div><div class="kpi-val c-text">${t.points.length}</div><div class="kpi-sub" style="margin-top:2px;">Total records</div></div>
                </div>`;
            }
            
            const pts = t.numericPts;
            const latest = pts[pts.length - 1];
            const prev = pts.length > 1 ? pts[pts.length - 2] : null;
            const lVal = formatVal(latest.numVal);
            const hasRange = !!(latest.rawRange || t.range);
            
            let lColor = 'c-text';
            const parsed = parseRange(latest.rawRange || t.range);
            if (parsed) {
                const stat = isInRange(latest.numVal, parsed);
                if (stat === 'normal') lColor = 'c-green';
                else if (stat === 'low' || stat === 'high') lColor = 'c-red';
            }

            let trendHtml = '<div class="kpi-val c-text">—</div><div class="kpi-sub" style="margin-top:2px;">Insufficient data</div>';
            if (prev) {
                const diff = latest.numVal - prev.numVal;
                const trendColor = diff > 0 ? (t.name.includes('HDL')?'c-green':'c-amber') : diff < 0 ? (t.name.includes('HDL')?'c-amber':'c-green') : 'c-text';
                const trendVal = (diff > 0 ? '▲ ' : '▼ ') + formatVal(Math.abs(diff));
                trendHtml = `<div class="kpi-val ${diff===0?'c-text':trendColor}">${diff === 0 ? 'No change' : trendVal}</div>
                            <div class="kpi-sub" style="margin-top:2px;">vs ${fmtDate(prev.date)}</div>`;
            }

            return `
            <div class="kpi-row grid-kpi-row">
                <div class="kpi-box"><div class="kpi-label">Latest</div><div class="kpi-val ${lColor}">${lVal} <span style="font-size:0.6rem;color:var(--muted)">${t.unit||''}</span></div><div class="kpi-sub" style="margin-top:2px;">${fmtDate(latest.date)}</div></div>
                <div class="kpi-box"><div class="kpi-label">Target Range</div><div class="kpi-val c-text" style="font-size:0.95rem;">${hasRange ? (latest.rawRange || t.range) : '—'}</div><div class="kpi-sub" style="margin-top:2px;">Ref. interval</div></div>
                <div class="kpi-box"><div class="kpi-label">Trend</div>${trendHtml}</div>
            </div>`;
        }

        function openTest(name) {
            const t = allTests.find(x => x.name === name);
            if (!t) return;

            if (isDesktop()) {
                const layout = document.querySelector('.layout');
                if (layout.classList.contains('is-grid-view')) {
                    // Collapse any other open card first
                    document.querySelectorAll('.test-card.expanded').forEach(el => {
                        if (el.id !== `test-btn-${safeId(name)}`) {
                            el.classList.remove('expanded');
                            el.removeAttribute('data-grid-open');
                            const container = el.querySelector('.grid-detail-container');
                            if (container) setTimeout(() => container.remove(), 370);
                        }
                    });

                    const cardId = `test-btn-${safeId(name)}`;
                    const cardEl = document.getElementById(cardId);
                    if (cardEl) {
                        // Toggle: clicking an open card collapses it
                        if (cardEl.hasAttribute('data-grid-open')) {
                            cardEl.classList.remove('expanded');
                            cardEl.removeAttribute('data-grid-open');
                            const container = cardEl.querySelector('.grid-detail-container');
                            if (container) setTimeout(() => container.remove(), 370);
                            if (currentChart) { try { currentChart.destroy(); } catch (_) {} currentChart = null; }
                            currentTestName = null;
                            return;
                        }

                        currentTestName = name;
                        cardEl.setAttribute('data-grid-open', 'true');
                        if (currentChart) { try { currentChart.destroy(); } catch (_) {} currentChart = null; }

                        // Build expanded content wrapper
                        const gridDetail = document.createElement('div');
                        gridDetail.className = 'grid-detail-container';
                        const inner = document.createElement('div');
                        inner.className = 'grid-detail-inner';

                        // Close button + KPI row (pure HTML — no canvas yet)
                        inner.innerHTML = `
                            <div class="grid-expand-header">
                                <button class="detail-nav-btn" style="width:28px;height:28px;" onclick="event.stopPropagation();openTest('${escStr(t.name)}')" aria-label="Close detail">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                                </button>
                            </div>
                            ${getKPIHtml(t)}
                        `;

                        gridDetail.appendChild(inner);
                        // Append to DOM BEFORE animating so content has layout
                        cardEl.appendChild(gridDetail);

                        // Force reflow, then trigger the 0fr → 1fr animation
                        void gridDetail.offsetWidth;
                        cardEl.classList.add('expanded');

                        // Render pure-HTML sections immediately (no canvas needed)
                        if (t.type === 'qualitative') {
                            renderSTDTimeline(t, inner);
                        } else {
                            if (t.numericPts.length > 0) {
                                renderGauge(t, inner);
                            }
                            renderHistoryTable(t, inner);
                        }

                        // Render Chart.js trend after animation ends so canvas has real dimensions
                        setTimeout(() => {
                            if (t.type !== 'qualitative' && t.numericPts.length > 1) {
                                renderTrendChart(t, inner);
                            }
                            cardEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                        }, 380);

                        return;
                    }
                }

                currentTestName = name;
                document.getElementById('desktopEmpty').style.display = 'none';
                const dc = document.getElementById('detailContent');
                dc.style.display = 'flex';
                dc.style.flexDirection = 'column';

                document.querySelectorAll('.test-card').forEach(el => el.classList.remove('active-card'));
                const cardId = `test-btn-${safeId(name)}`;
                const cardEl = document.getElementById(cardId);
                if (cardEl) {
                    cardEl.classList.add('active-card');
                    cardEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            } else {
                // Mobile: swap panels
                document.getElementById('panelList').classList.remove('visible');
                document.getElementById('panelDetail').classList.add('visible');
                document.getElementById('globalTopBar').style.display = 'none';
                document.getElementById('globalSearchArea').style.display = 'none';
            }

            // Header
            document.getElementById('detailTitle').textContent = t.name;
            document.getElementById('detailUnit').textContent = t.unit || '';

            // KPIs
            renderKPIs(t);

            // Dynamic body
            const dyn = document.getElementById('detailDynamic');
            dyn.innerHTML = '';

            if (currentChart) { try { currentChart.destroy(); } catch (_) { } currentChart = null; }

            if (t.type === 'qualitative') {
                renderSTDTimeline(t, dyn);
            } else {
                if (t.numericPts.length > 0) {
                    renderGauge(t, dyn);
                    if (t.numericPts.length > 1) {
                        renderTrendChart(t, dyn);
                    }
                }
                renderHistoryTable(t, dyn);
            }

            // Scroll detail panel to top
            const dp = document.getElementById('panelDetail');
            dp.scrollTop = 0;
        }

        function renderKPIs(t) {
            const latestEl = document.getElementById('kpiLatest');
            const latestDate = document.getElementById('kpiLatestDate');
            const rangeEl = document.getElementById('kpiRange');
            const trendEl = document.getElementById('kpiTrend');
            const trendSub = document.getElementById('kpiTrendSub');

            // Latest
            if (t.type === 'qualitative') {
                const last = t.points[t.points.length - 1];
                const s = qualStatus(last.rawResult);
                latestEl.textContent = s === 'clear' ? 'CLEAR' : s === 'reactive' ? '⚠ REACTIVE' : '?';
                latestEl.className = 'kpi-val ' + (s === 'clear' ? 'c-green' : s === 'reactive' ? 'c-red' : 'c-amber');
                latestDate.textContent = fmtDate(last.date);
                rangeEl.textContent = 'Nonreactive';
                rangeEl.className = 'kpi-val c-text';
                trendEl.textContent = `${t.points.length}`;
                trendEl.className = 'kpi-val c-text';
                trendSub.textContent = 'total tests';
            } else {
                const pts = t.numericPts;
                if (pts.length === 0) {
                    latestEl.textContent = '—';
                    latestEl.className = 'kpi-val c-text';
                    latestDate.textContent = '';
                    rangeEl.textContent = '—';
                    rangeEl.className = 'kpi-val c-text';
                    trendEl.textContent = '—';
                    trendEl.className = 'kpi-val c-text';
                    trendSub.textContent = '';
                    return;
                }

                const last = pts[pts.length - 1];
                const rangeStr = last.rawRange || t.range;
                const parsed = parseRange(rangeStr);
                const status = parsed ? isInRange(last.numVal, parsed) : null;

                latestEl.textContent = formatVal(last.numVal);
                latestEl.className = 'kpi-val ' + (status === 'normal' ? 'c-green' : status === 'high' || status === 'low' ? 'c-red' : 'c-text');
                latestDate.textContent = fmtDate(last.date);

                // Range display
                if (rangeStr && typeof rangeStr === 'string' && isNaN(Number(rangeStr))) {
                    rangeEl.textContent = rangeStr;
                } else {
                    rangeEl.textContent = '—';
                }
                rangeEl.className = 'kpi-val c-text';

                // Trend
                if (pts.length > 1) {
                    const prev = pts[pts.length - 2];
                    const diff = last.numVal - prev.numVal;
                    const pct = ((diff / (prev.numVal || 1)) * 100).toFixed(1);
                    if (Math.abs(diff) < 0.001) {
                        trendEl.textContent = '=';
                        trendEl.className = 'kpi-val c-text';
                        trendSub.textContent = 'No change';
                    } else if (diff > 0) {
                        trendEl.textContent = `+${formatVal(diff)}`;
                        trendEl.className = 'kpi-val c-red';
                        trendSub.textContent = `↑ ${pct}%`;
                    } else {
                        trendEl.textContent = formatVal(diff);
                        trendEl.className = 'kpi-val c-green';
                        trendSub.textContent = `↓ ${Math.abs(pct)}%`;
                    }
                } else {
                    trendEl.textContent = '—';
                    trendEl.className = 'kpi-val c-text';
                    trendSub.textContent = 'Need more';
                }
            }
        }

        function renderGauge(t, container) {
            const last = t.numericPts[t.numericPts.length - 1];
            const rangeStr = last?.rawRange || t.range;
            const parsed = parseRange(rangeStr);
            if (!parsed) return;

            const val = last.numVal;
            const status = isInRange(val, parsed);

            // Determine extent
            const hasMin = parsed.min !== undefined;
            const hasMax = parsed.max !== undefined;
            const rangeMin = hasMin ? parsed.min : 0;
            const rangeMax = hasMax ? parsed.max : val * 1.5;
            const trackMin = rangeMin - (rangeMax - rangeMin) * 0.25;
            const trackMax = rangeMax + (rangeMax - rangeMin) * 0.25;
            const trackRange = trackMax - trackMin;

            const zoneLeft = Math.max(0, ((rangeMin - trackMin) / trackRange) * 100);
            const zoneRight = Math.min(100, ((rangeMax - trackMin) / trackRange) * 100);
            const zoneWidth = zoneRight - zoneLeft;
            const markerPct = Math.min(100, Math.max(0, ((val - trackMin) / trackRange) * 100));

            const zoneColor = status === 'normal' ? 'rgba(31,203,122,0.35)' : 'rgba(79,156,248,0.2)';
            const markerColor = status === 'normal' ? 'var(--green)' : status === 'high' || status === 'low' ? 'var(--red)' : 'var(--accent)';

            container.insertAdjacentHTML('beforeend', `
      <div class="range-bar-section">
        <div class="range-bar-card">
          <div class="range-bar-label">Position in range</div>
          <div class="gauge-track">
            <div class="gauge-fill-zone" style="left:${zoneLeft}%;width:${zoneWidth}%;background:${zoneColor};"></div>
            <div class="gauge-marker" style="left:${markerPct}%;box-shadow:0 0 0 2px ${markerColor};"></div>
            <div style="position:absolute; top:20px; left:${markerPct}%; transform:translateX(-50%); color:${markerColor}; font-weight:700; font-family:'Syne', sans-serif; font-size:1.15rem;">${formatVal(val)}</div>
          </div>
          <div class="gauge-labels" style="margin-top:22px;">
            <span>${hasMin ? rangeMin : '—'}</span>
            <span>${hasMax ? rangeMax : '—'}</span>
          </div>
        </div>
      </div>
    `);
        }

        function renderTrendChart(t, container) {
            const canvasId = 'trendChart_' + safeId(t.name);
            container.insertAdjacentHTML('beforeend', `
      <div class="detail-divider">Trend over time</div>
      <div class="chart-section">
        <div class="chart-card">
          <div class="chart-inner" style="position:relative;height:220px;">
            <canvas id="${canvasId}"></canvas>
          </div>
        </div>
      </div>
    `);

            const labels = t.numericPts.map(p => fmtDate(p.date));
            const vals = t.numericPts.map(p => p.numVal);
            const rangeStr = t.numericPts[t.numericPts.length - 1]?.rawRange || t.range;
            const parsed = parseRange(rangeStr);

            // Point colors
            const pointColors = vals.map((v, i) => {
                if (!parsed) return getCssVar('--accent');
                const s = isInRange(v, parsed);
                return s === 'normal' ? getCssVar('--green') : s === 'high' || s === 'low' ? getCssVar('--red') : getCssVar('--accent');
            });

            const lastStatus = parsed ? isInRange(vals[vals.length - 1], parsed) : null;
            const lineColor = lastStatus === 'normal' ? getCssVar('--green') : lastStatus ? getCssVar('--red') : getCssVar('--accent');

            const ctx = document.getElementById(canvasId);
            if (!ctx) return;

            const grd = ctx.getContext('2d').createLinearGradient(0, 0, 0, 220);
            grd.addColorStop(0, lineColor + '33');
            grd.addColorStop(1, lineColor + '00');

            const datasets = [{
                data: vals,
                borderWidth: 2.5,
                segment: {
                    borderColor: ctx => pointColors[ctx.p1DataIndex]
                },
                pointBackgroundColor: pointColors,
                pointBorderColor: getCssVar('--bg'),
                pointBorderWidth: 1.5,
                pointRadius: 5,
                pointHoverRadius: 7,
                fill: true,
                backgroundColor: grd,
                tension: 0.35,
            }];

            if (parsed) {
                if (parsed.min !== undefined) {
                    datasets.push({
                        data: Array(labels.length).fill(parsed.min),
                        borderColor: 'rgba(255,255,255,0.15)',
                        borderWidth: 1,
                        borderDash: [4, 4],
                        pointRadius: 0,
                        fill: false,
                        tension: 0,
                        label: 'Min',
                    });
                }
                if (parsed.max !== undefined) {
                    datasets.push({
                        data: Array(labels.length).fill(parsed.max),
                        borderColor: 'rgba(255,255,255,0.15)',
                        borderWidth: 1,
                        borderDash: [4, 4],
                        pointRadius: 0,
                        fill: false,
                        tension: 0,
                        label: 'Max',
                    });
                }
            }

            currentChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: getCssVar('--tooltip-bg'),
                            titleColor: getCssVar('--text'),
                            bodyColor: getCssVar('--muted'),
                            borderColor: getCssVar('--card-border'),
                            borderWidth: 1,
                            padding: 10,
                            titleFont: { family: "'DM Mono', monospace", size: 11 },
                            bodyFont: { family: "'DM Mono', monospace", size: 12 },
                            callbacks: {
                                title: items => items[0].label,
                                label: item => item.datasetIndex === 0
                                    ? ` ${item.raw}${t.unit ? ' ' + t.unit : ''}`
                                    : ` ${item.dataset.label}: ${item.raw}`,
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            border: { display: false },
                            ticks: {
                                color: getCssVar('--muted'),
                                font: { family: "'DM Mono', monospace", size: 10 },
                                maxRotation: 0,
                                maxTicksLimit: 6,
                            }
                        },
                        y: {
                            grid: { color: getCssVar('--chart-grid'), drawBorder: false },
                            border: { display: false },
                            ticks: {
                                color: getCssVar('--muted'),
                                font: { family: "'DM Mono', monospace", size: 10 },
                            }
                        }
                    }
                }
            });
        }

        function renderSTDTimeline(t, container) {
            const rows = t.points.map(p => {
                const status = qualStatus(p.rawResult);
                const barClass = status === 'clear' ? 'clear' : status === 'reactive' ? 'reactive' : 'unknown';
                const label = status === 'clear' ? '● Nonreactive / Clear'
                    : status === 'reactive' ? '● Reactive / Detected'
                        : `● ${p.rawResult}`;
                return `
        <div class="std-row">
          <div class="std-date">${fmtDate(p.date)}</div>
          <div class="std-bar ${barClass}">
            <div class="std-dot"></div>${label}
          </div>
        </div>`;
            }).join('');

            container.insertAdjacentHTML('beforeend', `
      <div class="std-timeline">
        <div class="std-timeline-card">
          <div class="std-timeline-label">Test history</div>
          ${rows}
        </div>
      </div>
    `);
        }

        function renderHistoryTable(t, container) {
            const pts = t.type === 'qualitative' ? [] : t.numericPts;
            if (pts.length === 0) return;

            const rows = [...pts].reverse().map((p, i, arr) => {
                const prev = arr[i + 1]; // reversed, so prev is next in array
                const rangeStr = p.rawRange || t.range;
                const parsed = parseRange(rangeStr);
                const status = parsed ? isInRange(p.numVal, parsed) : null;

                let deltaHtml = '';
                if (prev) {
                    const diff = p.numVal - prev.numVal;
                    if (Math.abs(diff) < 0.001) {
                        deltaHtml = `<span class="hist-delta delta-flat">=</span>`;
                    } else if (diff > 0) {
                        deltaHtml = `<span class="hist-delta delta-up">↑ +${formatVal(diff)}</span>`;
                    } else {
                        deltaHtml = `<span class="hist-delta delta-down">↓ ${formatVal(diff)}</span>`;
                    }
                }

                const valColor = status === 'normal' ? 'c-green' : status === 'high' || status === 'low' ? 'c-red' : 'c-text';

                return `
        <div class="history-row">
          <div class="hist-date">${fmtDate(p.date)}</div>
          <div class="hist-val ${valColor}">${formatVal(p.numVal)}</div>
          ${deltaHtml}
        </div>`;
            }).join('');

            container.insertAdjacentHTML('beforeend', `
      <div class="detail-divider" style="margin-top:8px;">All readings</div>
      <div class="history-section">
        <div class="history-header">
          <span>Date</span>
          <span>Value</span>
          <span>Change</span>
        </div>
        ${rows}
      </div>
    `);
        }

        // ── NAVIGATION ───────────────────────────────────────────────
        function goBack() {
            if (isDesktop()) return; // no back on desktop
            document.getElementById('panelDetail').classList.remove('visible');
            document.getElementById('panelList').classList.add('visible');
            document.getElementById('globalTopBar').style.display = '';
            document.getElementById('globalSearchArea').style.display = '';
            if (currentChart) { try { currentChart.destroy(); } catch (_) { } currentChart = null; }
            currentTestName = null;
        }

        // ── UTILS ─────────────────────────────────────────────────────
        function getCssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
        function safeId(name) { return name.replace(/[^a-zA-Z0-9]/g, '_'); }
        function escStr(name) { return name.replace(/'/g, "\\'"); }
        function formatVal(v) {
            if (v === null || v === undefined) return '—';
            if (Math.abs(v) >= 1000) return v.toFixed(0);
            if (Number.isInteger(v)) return String(v);
            const s = v.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
            return s;
        }
        function fmtDate(d) {
            if (!d) return '';
            const parts = d.split('/');
            if (parts.length === 3) {
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const m = parseInt(parts[1]) - 1;
                return `${months[m]} '${parts[0].slice(2)}`;
            }
            return d;
        }

        // ── INIT ─────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>

</html>
