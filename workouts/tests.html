<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Labs | Sean's Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0a0b0e;
            --bg-gradient: radial-gradient(circle at top right, rgba(45, 80, 150, 0.16), transparent 55%), radial-gradient(circle at bottom left, rgba(120, 45, 150, 0.14), transparent 55%);
            --surface: #111318;
            --surface2: #181c23;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.12);
            --text: #eeeef0;
            --muted: #7a7f8e;
            --faint: #3a3f4e;

            --green: #1fcb7a;
            --green-bg: rgba(31, 203, 122, 0.12);
            --red: #f04e4e;
            --red-bg: rgba(240, 78, 78, 0.12);
            --amber: #f5a623;
            --amber-bg: rgba(245, 166, 35, 0.12);
            --blue: #4f9cf8;
            --blue-bg: rgba(79, 156, 248, 0.12);

            --accent: #4f9cf8;
            --pill-r: 12px;
            --card-r: 18px;

            --glass-bg: rgba(10, 11, 14, 0.88);
            --card-glass: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.05);
            --card-hover-border: rgba(255, 255, 255, 0.12);
            --card-glow: rgba(255, 255, 255, 0.06);
            --sheet-bg: rgba(17, 19, 24, 0.95);
            --sheet-handle: rgba(255, 255, 255, 0.15);
            --detail-bg: rgba(10, 11, 14, 0.75);
            --nav-btn-bg: rgba(255, 255, 255, 0.06);
            --nav-btn-active: rgba(255, 255, 255, 0.12);
            --icon-white: #ffffff;
            --tooltip-bg: #181c23;
            --chart-grid: rgba(255, 255, 255, 0.05);
            --gauge-bg: #fff;
        }

        :root.light-mode {
            --bg: #f9f9fb;
            --bg-gradient: radial-gradient(circle at top right, rgba(50, 100, 240, 0.09), transparent 55%), radial-gradient(circle at bottom left, rgba(150, 50, 240, 0.08), transparent 55%);
            --surface: #ffffff;
            --surface2: #f2f3f7;
            --border: rgba(0, 0, 0, 0.08);
            --border2: rgba(0, 0, 0, 0.12);
            --text: #1a1b20;
            --muted: #6b7280;
            --faint: #c2c6ce;

            --green: #059669;
            --green-bg: rgba(16, 185, 129, 0.15);
            --red: #e82a2a;
            --red-bg: rgba(239, 68, 68, 0.12);
            --amber: #d97706;
            --amber-bg: rgba(245, 158, 11, 0.15);
            --blue: #2563eb;
            --blue-bg: rgba(59, 130, 246, 0.12);

            --accent: #2563eb;

            --glass-bg: rgba(249, 249, 251, 0.88);
            --card-glass: rgba(0, 0, 0, 0.02);
            --card-border: rgba(0, 0, 0, 0.06);
            --card-hover-border: rgba(0, 0, 0, 0.12);
            --card-glow: rgba(0, 0, 0, 0.04);
            --sheet-bg: rgba(255, 255, 255, 0.95);
            --sheet-handle: rgba(0, 0, 0, 0.15);
            --detail-bg: rgba(249, 249, 251, 0.85);
            --nav-btn-bg: rgba(0, 0, 0, 0.04);
            --nav-btn-active: rgba(0, 0, 0, 0.08);
            --icon-white: #1a1b20;
            --tooltip-bg: #ffffff;
            --chart-grid: rgba(0, 0, 0, 0.05);
            --gauge-bg: var(--bg);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            background-color: var(--bg);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            overscroll-behavior: none;
        }

        /* ── HEADER ── */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: env(safe-area-inset-top, 0px) 0 0;
        }

        .top-bar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--accent);
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            padding: 8px 14px;
            border: 1px solid rgba(79, 156, 248, 0.3);
            border-radius: 999px;
            transition: background 0.2s, border-color 0.2s;
        }

        .back-btn:active {
            background: rgba(79, 156, 248, 0.1);
        }

        .top-title {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text);
            text-align: center;
        }

        .top-subtitle {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            text-align: center;
        }

        .top-center {
            display: flex;
            flex-direction: column;
            gap: 1px;
            align-items: center;
        }

        .top-spacer {
            width: 80px;
            display: flex;
            justify-content: flex-end;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--nav-btn-bg);
            border: 1px solid var(--border);
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .theme-toggle:active {
            background: var(--nav-btn-active);
            transform: scale(0.95);
        }

        /* ── SEARCH + FILTER ── */
        .search-area {
            padding: 14px 18px 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 69px;
            z-index: 99;
            border-bottom: 1px solid var(--border);
        }

        .search-wrap {
            position: relative;
        }

        .search-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
            pointer-events: none;
        }

        #testSearch {
            width: 100%;
            padding: 11px 14px 11px 42px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--pill-r);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #testSearch:focus {
            border-color: var(--accent);
        }

        #testSearch::placeholder {
            color: var(--muted);
        }

        /* category chips */
        .chip-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin: 0 -18px;
            padding: 10px 18px 12px 60px;
            /* 60px perfectly lines up with the indented "Search" text */
            scrollbar-width: none;
        }

        .chip-row::-webkit-scrollbar {
            display: none;
        }

        .chip {
            flex-shrink: 0;
            padding: 5px 13px;
            border-radius: 999px;
            border: 1px solid var(--border2);
            background: var(--surface2);
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: all 0.18s;
            user-select: none;
        }

        .chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* ── LAYOUT ── */
        .layout {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            transition: all 0.3s ease;
            position: relative;
        }

        /* ── ACTION SHEET ── */
        .action-sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .action-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--sheet-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px 28px 0 0;
            padding: 16px 24px calc(env(safe-area-inset-bottom, 20px) + 20px);
            z-index: 1001;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            border-top: 1px solid var(--border);
        }

        .action-sheet.visible {
            transform: translateY(0);
        }

        .action-sheet-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet-handle {
            width: 40px;
            height: 5px;
            background: var(--sheet-handle);
            border-radius: 3px;
            margin: 0 auto 24px;
        }

        .sheet-title {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .sheet-action {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 0;
            border-bottom: 1px solid var(--border);
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            transition: opacity 0.2s;
        }

        .sheet-action:active {
            opacity: 0.6;
        }

        .sheet-action:last-child {
            border-bottom: none;
        }

        .sheet-action svg {
            color: var(--accent);
        }

        /* ── PANEL: TEST LIST ── */
        .panel-list {
            overflow-y: auto;
            flex: 1;
            padding: 12px 18px 30px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .panel-list.visible {
            display: flex;
        }

        .panel-list>* {
            flex-shrink: 0;
        }

        .section-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            color: var(--muted);
            text-transform: uppercase;
            padding: 12px 0 4px;
        }

        .test-card {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--card-r);
            padding: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0;
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .test-card-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
        }

        .grid-detail-container {
            width: 100%;
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .test-card.expanded .grid-detail-container {
            grid-template-rows: 1fr;
        }

        .grid-detail-inner {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0; /* required for grid-template-rows: 0fr collapse */
        }

        .grid-kpi-row {
            margin-top: 0;
            padding-top: 14px;
            border-top: none;
        }

        /* Close-button strip at top of expanded grid detail */
        .grid-expand-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 12px 0 4px;
            margin-top: 8px;
            border-top: 1px solid var(--border);
        }

        /* No hover lift when a card is already expanded */
        .test-card.expanded:hover {
            transform: none;
        }

        .test-card::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, var(--card-glow) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 50%;
            pointer-events: none;
        }

        .test-card.active-card {
            background: rgba(79, 156, 248, 0.05);
            border-color: rgba(79, 156, 248, 0.3);
            box-shadow: 0 0 16px rgba(79, 156, 248, 0.1) inset, 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .test-card.active-card::before {
            background: radial-gradient(circle, rgba(79, 156, 248, 0.1) 0%, transparent 70%);
            opacity: 1;
        }

        .test-card:hover {
            border: 1px solid var(--card-hover-border);
            transform: translateY(-1px);
        }

        .test-card:hover::before {
            opacity: 1;
        }

        /* ── HERO WIDGET ── */
        .hero-widget {
            position: relative;
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: var(--card-r);
            padding: 18px 20px;
            margin-bottom: 24px;
            overflow: hidden;
            transform: translateZ(0);
            /* Prevents Safari backdrop layer detachment */
        }

        .hero-glow {
            position: absolute;
            top: -40px;
            right: -40px;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, rgba(79, 156, 248, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        .hero-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .hero-kpi {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: center;
            flex: 1;
            justify-content: center;
        }

        .hero-kpi-val {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .hero-kpi-lbl {
            font-family: 'DM Mono', monospace;
            font-size: 0.6rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hero-kpi-divider {
            width: 1px;
            height: 34px;
            background: rgba(255, 255, 255, 0.08);
        }

        .test-card-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .test-card-name {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .test-card-meta {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            color: var(--muted);
            display: flex;
            gap: 10px;
        }

        .test-card-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
            flex-shrink: 0;
        }

        /* inline sparkline */
        .sparkline-wrap {
            width: 64px;
            height: 28px;
        }

        /* status badge */
        .status-badge {
            padding: 3px 10px;
            border-radius: 999px;
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .badge-green {
            background: var(--green-bg);
            color: var(--green);
        }

        .badge-red {
            background: var(--red-bg);
            color: var(--red);
        }

        .badge-amber {
            background: var(--amber-bg);
            color: var(--amber);
        }

        /* latest value chip on card */
        .latest-chip {
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        /* chevron */
        .chevron {
            color: var(--faint);
            flex-shrink: 0;
        }

        /* ── PANEL: DETAIL VIEW ── */
        .panel-detail {
            display: none;
            flex-direction: column;
            overflow-y: auto;
            flex: 1;
        }

        .panel-detail.visible {
            display: flex;
        }

        .detail-header {
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--detail-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--card-border);
        }

        .detail-nav-btn {
            background: var(--nav-btn-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .detail-nav-btn:active {
            background: var(--nav-btn-active);
            transform: scale(0.96);
        }

        .detail-title-block {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .detail-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-unit {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            color: var(--muted);
        }

        /* KPI row */
        .kpi-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 16px 18px;
        }

        .kpi-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            text-align: center;
        }

        .kpi-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.6rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .kpi-val {
            font-family: 'Syne', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1;
        }

        .kpi-sub {
            font-family: 'DM Mono', monospace;
            font-size: 0.62rem;
            color: var(--muted);
        }

        /* chart card */
        .chart-section {
            padding: 0 18px 16px;
        }

        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--card-r);
            padding: 16px;
        }

        .chart-card canvas {
            display: block;
        }

        /* range bar (gauge) */
        .range-bar-section {
            padding: 0 18px 16px;
        }

        .range-bar-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--card-r);
            padding: 16px 18px;
        }

        .range-bar-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .gauge-track {
            position: relative;
            height: 8px;
            background: var(--surface2);
            border-radius: 999px;
            margin-bottom: 6px;
        }

        .gauge-fill-zone {
            position: absolute;
            top: 0;
            height: 100%;
            border-radius: 999px;
        }

        .gauge-marker {
            position: absolute;
            top: -4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--gauge-bg);
            transform: translateX(-50%);
            border: 2px solid var(--bg);
            box-shadow: 0 0 0 2px var(--accent);
            transition: left 0.5s cubic-bezier(.34, 1.56, .64, 1);
        }

        .gauge-labels {
            display: flex;
            justify-content: space-between;
            font-family: 'DM Mono', monospace;
            font-size: 0.62rem;
            color: var(--muted);
        }

        /* STD timeline */
        .std-timeline {
            padding: 0 18px 16px;
        }

        .std-timeline-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--card-r);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .std-timeline-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .std-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .std-date {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            color: var(--muted);
            width: 80px;
            flex-shrink: 0;
        }

        .std-bar {
            flex: 1;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            transition: all 0.3s;
        }

        .std-bar.clear {
            background: var(--green-bg);
            color: var(--green);
            border: 1px solid rgba(31, 203, 122, 0.2);
        }

        .std-bar.reactive {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid rgba(240, 78, 78, 0.2);
        }

        .std-bar.unknown {
            background: var(--amber-bg);
            color: var(--amber);
            border: 1px solid rgba(245, 166, 35, 0.2);
        }

        .std-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .clear .std-dot {
            background: var(--green);
        }

        .reactive .std-dot {
            background: var(--red);
        }

        .unknown .std-dot {
            background: var(--amber);
        }

        /* history table */
        .history-section {
            padding: 0 18px 40px;
        }

        .history-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            color: var(--faint);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .history-header span:nth-child(1) {
            width: 90px;
            flex-shrink: 0;
        }

        .history-header span:nth-child(2) {
            flex: 1;
        }

        .history-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .history-row:last-child {
            border-bottom: none;
        }

        .hist-date {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            color: var(--muted);
            width: 90px;
            flex-shrink: 0;
        }

        .hist-val {
            font-family: 'Syne', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            flex: 1;
        }

        .hist-delta {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .delta-up {
            background: var(--red-bg);
            color: var(--red);
        }

        .delta-down {
            background: var(--green-bg);
            color: var(--green);
        }

        .delta-flat {
            background: var(--surface2);
            color: var(--muted);
        }

        /* Loading spinner */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            gap: 14px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* colors for kpi val */
        .c-green {
            color: var(--green);
        }

        .c-red {
            color: var(--red);
        }

        .c-amber {
            color: var(--amber);
        }

        .c-text {
            color: var(--text);
        }

        /* SECTION DIVIDER in detail */
        .detail-divider {
            font-family: 'DM Mono', monospace;
            font-size: 0.62rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 18px 8px;
        }

        /* empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            gap: 8px;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
        }

        /* Scroll inertia for iOS */
        .panel-list,
        .panel-detail {
            -webkit-overflow-scrolling: touch;
        }

        /* Mobile: desktop wrapper divs are transparent containers */
        .desktop-sidebar,
        .desktop-main {
            display: contents;
        }



        /* Empty state hidden on mobile */
        .desktop-empty {
            display: none;
        }

        .grid-toggle-btn {
            display: none !important;
        }

        /* ── DESKTOP LAYOUT ── */
        @media (min-width: 900px) {
            .grid-toggle-btn {
                display: flex !important;
            }
            .layout.is-grid-view .desktop-sidebar {
                width: 100%;
                border-right: none;
                overflow: hidden; /* keep sidebar scroll contained */
            }

            /* In grid mode the sidebar fills full height, panel-list scrolls */
            .layout.is-grid-view .desktop-sidebar .sidebar-top {
                padding: 14px 24px 0;
            }

            .layout.is-grid-view .desktop-sidebar .chip-row {
                margin: 0 -24px;
                padding: 10px 24px 12px;
            }
            .layout.is-grid-view .desktop-main {
                display: none !important;
            }
            .layout.is-grid-view #panelList {
                display: grid !important;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 12px;
                align-content: start;
                padding: 20px 24px 40px;
            }
            .layout.is-grid-view #panelList .section-label {
                grid-column: 1 / -1;
                font-size: 0.82rem;
                padding-top: 16px;
                padding-left: 0;
            }
            .layout.is-grid-view #panelList .hero-widget {
                grid-column: 1 / -1;
                margin-bottom: 0;
            }

            /* ── GRID CARD TILE STYLE ── */

            /* Collapsed grid card: proper tile appearance */
            .layout.is-grid-view #panelList .test-card:not(.expanded) {
                background: var(--surface);
                border: 1px solid var(--border);
                padding: 16px 18px;
                min-height: 96px;
                gap: 0;
                border-radius: 16px;
            }

            /* Stack content vertically inside the tile */
            .layout.is-grid-view #panelList .test-card:not(.expanded) .test-card-inner {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            /* Name row: small + muted mono label */
            .layout.is-grid-view #panelList .test-card:not(.expanded) .test-card-left {
                flex: none;
                width: 100%;
                gap: 2px;
            }

            .layout.is-grid-view #panelList .test-card:not(.expanded) .test-card-name {
                font-family: 'DM Mono', monospace;
                font-size: 0.7rem;
                font-weight: 400;
                color: var(--muted);
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }

            .layout.is-grid-view #panelList .test-card:not(.expanded) .test-card-meta {
                font-size: 0.62rem;
                gap: 6px;
            }

            /* Value + sparkline row at the bottom of the tile */
            .layout.is-grid-view #panelList .test-card:not(.expanded) .test-card-right {
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 0;
                flex-shrink: 0;
            }

            .layout.is-grid-view #panelList .test-card:not(.expanded) .latest-chip {
                font-size: 1.5rem;
                font-weight: 700;
                font-family: 'Syne', sans-serif;
            }

            .layout.is-grid-view #panelList .test-card:not(.expanded) .sparkline-wrap {
                width: 80px;
                height: 34px;
                flex-shrink: 0;
            }

            /* Badge cards (qualitative): bigger badge */
            .layout.is-grid-view #panelList .test-card:not(.expanded) .status-badge {
                font-size: 0.72rem;
                padding: 5px 14px;
            }

            /* Hide the useless chevron in grid view */
            .layout.is-grid-view #panelList .test-card .chevron {
                display: none;
            }

            /* ── EXPANDED GRID CARD ── */

            /* Expanded card spans full grid width so detail content has room */
            .layout.is-grid-view #panelList .test-card.expanded {
                grid-column: 1 / -1;
                cursor: default;
                background: var(--surface);
                border-color: rgba(79, 156, 248, 0.25);
                padding: 16px 20px;
            }

            /* Keep the collapsed header row horizontal + compact inside expanded card */
            .layout.is-grid-view #panelList .test-card.expanded .test-card-inner {
                flex-direction: row;
                align-items: center;
                gap: 12px;
            }

            .layout.is-grid-view #panelList .test-card.expanded .test-card-name {
                font-family: 'DM Sans', sans-serif;
                font-size: 0.85rem;
                font-weight: 500;
                color: var(--text);
                text-transform: none;
                letter-spacing: 0;
            }

            .layout.is-grid-view #panelList .test-card.expanded .latest-chip {
                font-size: 1rem;
            }

            .layout.is-grid-view #panelList .test-card.expanded .sparkline-wrap {
                width: 52px;
                height: 24px;
            }

            /* Inside expanded grid cards, reset padding to zero so sections fill full width */
            .layout.is-grid-view .grid-detail-inner .kpi-row {
                grid-template-columns: repeat(3, 1fr);
                padding: 12px 0 10px;
                gap: 10px;
            }

            .layout.is-grid-view .grid-detail-inner .kpi-box {
                padding: 12px 10px;
            }

            .layout.is-grid-view .grid-detail-inner .range-bar-section,
            .layout.is-grid-view .grid-detail-inner .std-timeline,
            .layout.is-grid-view .grid-detail-inner .history-section,
            .layout.is-grid-view .grid-detail-inner .chart-section,
            .layout.is-grid-view .grid-detail-inner .detail-divider {
                padding-left: 0;
                padding-right: 0;
            }

            .layout.is-grid-view .grid-detail-inner .chart-inner {
                height: 220px !important;
            }

            /* History table at full width */
            .layout.is-grid-view .grid-detail-inner .history-header span:nth-child(1),
            .layout.is-grid-view .grid-detail-inner .hist-date {
                width: 110px;
            }

            /* Full-height, no mobile stacking */
            body {
                overflow: hidden;
            }

            .top-bar-inner {
                padding: 16px 32px;
            }

            .top-title {
                font-size: 1.1rem;
            }

            .search-area {
                /* Sidebar search area — sits inside sidebar, not sticky globally */
                position: static;
                padding: 0;
                background: none;
                backdrop-filter: none;
                border-bottom: none;
            }

            .layout {
                flex-direction: row;
                height: calc(100vh - 65px);
                /* just the top bar */
                overflow: hidden;
            }

            /* ── DESKTOP SIDEBAR ── */
            .desktop-sidebar {
                width: 340px;
                flex-shrink: 0;
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                height: 100%;
                overflow: hidden;
                background: transparent;
            }

            .sidebar-top {
                padding: 16px 16px 0;
                flex-shrink: 0;
                border-bottom: 1px solid var(--border);
                background: transparent;
                width: 100%;
                overflow: hidden;
            }

            .chip-row {
                display: flex;
                gap: 8px;
                overflow-x: auto;
                white-space: nowrap;
                margin: 0 -16px;
                padding: 10px 16px 12px 58px;
                width: calc(100% + 32px);
                scrollbar-width: none;
            }

            .chip-row::-webkit-scrollbar {
                display: none;
            }

            .panel-list {
                padding: 8px 12px 30px;
                flex: 1;
                overflow-y: auto;
                display: flex !important;
                /* always visible on desktop */
                gap: 6px;
                scroll-behavior: smooth;
            }

            .section-label {
                font-size: 0.6rem;
                padding: 10px 4px 2px;
            }

            .test-card {
                padding: 11px 12px;
                border-radius: 12px;
            }

            .test-card-name {
                font-size: 0.82rem;
            }

            .sparkline-wrap {
                width: 52px;
                height: 24px;
            }

            /* ── DESKTOP MAIN ── */
            .desktop-main {
                flex: 1;
                display: flex;
                flex-direction: column;
                height: 100%;
                overflow: hidden;
                background: transparent;
            }

            .panel-detail {
                display: flex !important;
                /* always visible on desktop */
                flex: 1;
                overflow-y: auto;
                padding-bottom: 40px;
            }

            .panel-detail>* {
                min-width: 0;
            }

            /* prevent overflow */

            /* Detail header overrides for desktop */
            .detail-header {
                padding: 24px 32px 18px;
                border-bottom: 1px solid var(--border);
                position: sticky;
                top: 0;
                background: var(--detail-bg);
                backdrop-filter: blur(16px);
                z-index: 10;
                justify-content: flex-start;
                gap: 16px;
            }

            .detail-title-block {
                text-align: left;
            }

            .detail-nav-btn.is-back {
                display: none;
            }

            .detail-title {
                font-size: 1.3rem;
            }

            .detail-unit {
                font-size: 0.72rem;
            }

            /* KPIs roomier on desktop */
            .kpi-row {
                padding: 20px 28px;
                gap: 14px;
            }

            .kpi-box {
                padding: 16px 14px;
                border-radius: 16px;
            }

            .kpi-val {
                font-size: 1.5rem;
            }

            /* Chart taller on desktop */
            .chart-section {
                padding: 0 28px 20px;
            }

            .range-bar-section {
                padding: 0 28px 20px;
            }

            .std-timeline {
                padding: 0 28px 20px;
            }

            .history-section {
                padding: 0 28px 40px;
            }

            .detail-divider {
                padding: 4px 28px 8px;
            }

            /* Taller chart canvas on desktop */
            .chart-inner {
                height: 320px !important;
            }

            /* Desktop empty state for detail panel */
            .desktop-empty {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                flex: 1;
                height: 100%;
                gap: 12px;
                color: var(--faint);
                font-family: 'DM Mono', monospace;
                font-size: 0.8rem;
                letter-spacing: 0.05em;
                user-select: none;
            }

            .desktop-empty-icon {
                width: 64px;
                height: 64px;
                border: 2px solid var(--border);
                border-radius: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--muted);
                opacity: 0.4;
                margin-bottom: 12px;
                background: var(--surface2);
            }

            .desktop-empty p {
                font-family: 'Syne', sans-serif;
                font-size: 0.95rem;
                font-weight: 500;
                color: var(--muted);
            }
        }

        /* ── ULTRA-WIDE ── */
        @media (min-width: 1280px) {
            .desktop-sidebar {
                width: 380px;
            }

            .kpi-row {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>
