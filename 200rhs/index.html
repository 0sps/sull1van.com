<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>200 RHS Room Signup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9e2f2;
      --line-strong: #b8c5da;
      --empty: #e7eef8;
      --open: #2f6fbb;
      --half: #b25e16;
      --full: #7f1d1d;
      --open-soft: #dceeff;
      --half-soft: #fff0d8;
      --full-soft: #ffe2e2;
      --focus: #2563eb;
      --shadow: 0 18px 42px rgba(20, 34, 57, 0.08);
      --radius: 8px;
      --font-heading: "Outfit", system-ui, sans-serif;
      --font-body: "Work Sans", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(248, 250, 252, 0.96)),
        repeating-linear-gradient(90deg, rgba(23, 32, 51, 0.035) 0 1px, transparent 1px 80px),
        repeating-linear-gradient(0deg, rgba(23, 32, 51, 0.03) 0 1px, transparent 1px 80px);
    }

    body {
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus), transparent 35%);
      outline-offset: 3px;
    }

    .page {
      width: min(1600px, calc(100% - 32px));
      margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top)) 64px calc(40px + env(safe-area-inset-bottom)) 0;
    }

    .board-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 14px;
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-heading);
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      line-height: 1;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(118px, 1fr));
      gap: 8px;
      min-width: min(460px, 100%);
    }

    .metric {
      min-height: 72px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.76);
    }

    .metric strong {
      display: block;
      margin-bottom: 2px;
      font-family: var(--font-heading);
      font-size: 2rem;
      line-height: 1;
    }

    .metric span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .floor {
      margin-top: 18px;
    }

    .floor-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .floor-heading h2 {
      margin: 0;
      font-size: 1.12rem;
    }

    .floor-heading span {
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .floor-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.74);
      box-shadow: var(--shadow);
      -webkit-overflow-scrolling: touch;
      scrollbar-color: #a9b8cf transparent;
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(19, 136px);
      gap: 8px;
      padding: 10px;
      width: max-content;
      min-width: 100%;
    }

    .room {
      position: relative;
      width: 136px;
      min-height: 132px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
    }

    .room:hover {
      border-color: #9fb1cc;
      box-shadow: 0 8px 22px rgba(20, 34, 57, 0.08);
    }

    .room.is-half {
      background: var(--half-soft);
      border-color: #f1c57d;
    }

    .room.is-full {
      background: var(--full-soft);
      border-color: #f0a3a3;
    }

    .room-number {
      display: block;
      margin-bottom: 7px;
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .room-count {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 700;
    }

    .occupants {
      display: grid;
      gap: 4px;
      min-height: 52px;
      margin-bottom: 7px;
    }

    .occupant {
      min-width: 0;
      padding: 5px 7px;
      border: 1px solid rgba(20, 34, 57, 0.1);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.66);
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
    }

    .occupant.is-empty {
      color: var(--muted);
      font-weight: 600;
      opacity: 0.76;
    }

    .capacity {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
    }

    .bed {
      min-height: 28px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.64) 0 24%, transparent 24% 100%),
        var(--open-soft);
      color: #184a80;
      font-size: 0;
      transition: background-color 180ms ease, border-color 180ms ease, opacity 180ms ease;
    }

    .bed:hover {
      border-color: var(--open);
      background-color: #c9e3ff;
    }

    .bed.is-taken {
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0 4px, transparent 4px 8px),
        var(--full);
      border-color: var(--full);
      color: #fff;
    }

    .room.is-half .bed.is-taken {
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0 4px, transparent 4px 8px),
        var(--half);
      border-color: var(--half);
    }

    .sidebar {
      position: fixed;
      z-index: 20;
      top: calc(24px + env(safe-area-inset-top));
      right: 16px;
      width: min(380px, calc(100vw - 64px));
      max-height: calc(100dvh - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow-y: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow);
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    body.drawer-closed .sidebar {
      transform: translateX(calc(100% + 16px));
      box-shadow: 0 8px 24px rgba(20, 34, 57, 0.08);
    }

    .drawer-toggle {
      position: fixed;
      z-index: 30;
      top: calc(120px + env(safe-area-inset-top));
      right: 0;
      width: 42px;
      min-height: 72px;
      border: 1px solid var(--line);
      border-right: 0;
      border-radius: 8px 0 0 8px;
      background: #172033;
      color: #fff;
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      box-shadow: 0 12px 28px rgba(20, 34, 57, 0.12);
      transition: background-color 180ms ease, border-color 180ms ease, opacity 180ms ease;
    }

    .drawer-toggle:hover {
      background: #26344f;
      border-color: #26344f;
    }

    .sidebar h2 {
      margin: 0 0 4px;
      font-size: 1.2rem;
      line-height: 1.1;
    }

    .sidebar p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .field-grid {
      display: grid;
      gap: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 44px;
      padding: 0 11px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .action-button {
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #172033;
      color: #fff;
      font-weight: 700;
      transition: background-color 180ms ease, border-color 180ms ease, opacity 180ms ease, box-shadow 180ms ease;
    }

    .action-button:hover {
      background: #26344f;
      border-color: #26344f;
    }

    .action-button.secondary {
      background: #fff;
      color: var(--ink);
    }

    .action-button.secondary:hover {
      background: #f1f5f9;
      border-color: #aebbd0;
    }

    .selected-card {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fafc;
    }

    .selected-card strong {
      display: block;
      margin-bottom: 2px;
      font-family: var(--font-heading);
      font-size: 1.04rem;
    }

    .selected-card span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .status-line {
      margin-top: 10px;
      min-height: 1.4em;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1220px) {
      .field-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 20px, 1600px);
        padding-top: calc(14px + env(safe-area-inset-top));
        padding-right: 52px;
      }

      .board-header,
      .summary,
      .field-grid {
        grid-template-columns: 1fr;
      }

      .summary {
        gap: 8px;
      }

      .metric {
        min-height: auto;
      }

      .room-grid {
        grid-template-columns: repeat(19, 136px);
        gap: 7px;
        padding: 8px;
      }

      .room {
        padding: 7px;
      }

      .sidebar {
        top: calc(14px + env(safe-area-inset-top));
        right: 10px;
        width: min(360px, calc(100vw - 58px));
        max-height: calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }

      .drawer-toggle {
        top: calc(96px + env(safe-area-inset-top));
      }
    }

    @media (max-width: 430px) {
      .form-actions {
        grid-template-columns: 1fr;
      }

      .floor-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body class="drawer-closed">
  <main class="page">
    <section class="board" aria-label="Room board">
      <header class="board-header">
        <div>
          <h1>200 RHS Room Board</h1>
        </div>
        <section class="summary" aria-label="Signup summary">
          <div class="metric">
            <strong id="openBeds">76</strong>
            <span>beds left</span>
          </div>
          <div class="metric">
            <strong id="halfRooms">0</strong>
            <span>rooms half booked</span>
          </div>
          <div class="metric">
            <strong id="fullRooms">0</strong>
            <span>rooms full</span>
          </div>
        </section>
      </header>

      <section class="floor" aria-labelledby="floorOne">
        <div class="floor-heading">
          <h2 id="floorOne">First floor</h2>
          <span id="floorOneCount">38 beds left</span>
        </div>
        <div class="floor-scroll" aria-label="First floor rooms, scroll horizontally">
          <div class="room-grid" id="floorOneGrid"></div>
        </div>
      </section>

      <section class="floor" aria-labelledby="floorTwo">
        <div class="floor-heading">
          <h2 id="floorTwo">Second floor</h2>
          <span id="floorTwoCount">38 beds left</span>
        </div>
        <div class="floor-scroll" aria-label="Second floor rooms, scroll horizontally">
          <div class="room-grid" id="floorTwoGrid"></div>
        </div>
      </section>
    </section>

      <button class="drawer-toggle" type="button" id="drawerToggle" aria-label="Open assignment drawer" aria-expanded="false">&lsaquo;</button>
      <aside class="sidebar" id="assignmentDrawer" aria-label="Person assignment panel">
        <h2>Assign person</h2>
        <p>Fill this out, then select a bed. Select an assigned bed to clear it.</p>
        <form id="personForm">
          <div class="field-grid">
            <div class="field">
              <label for="firstName">First name</label>
              <input id="firstName" name="firstName" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label for="lastName">Last name</label>
              <input id="lastName" name="lastName" autocomplete="family-name" required>
            </div>
            <div class="field">
              <label for="rank">Military rank</label>
              <select id="rank" name="rank" required></select>
            </div>
            <div class="field">
              <label for="shop">Shop</label>
              <select id="shop" name="shop" required>
                <option value="ENGR">ENGR</option>
                <option value="DIRT">DIRT</option>
                <option value="SUPP">SUPP</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button class="action-button" type="submit">Save profile</button>
            <button class="action-button secondary" type="button" id="resetButton">Reset board</button>
          </div>
          <p class="status-line" id="formStatus" aria-live="polite"></p>
        </form>
        <div class="selected-card" aria-live="polite">
          <strong id="selectedName">No profile saved</strong>
          <span id="selectedMeta">Save a profile before assigning a bed.</span>
        </div>
      </aside>
  </main>

  <script>
    const rankOptions = [
      { value: "airman-basic", label: "Airman Basic", abbr: "AB" },
      { value: "airman", label: "Airman", abbr: "Amn" },
      { value: "airman-first-class", label: "Airman First Class", abbr: "A1C" },
      { value: "senior-airman", label: "Senior Airman", abbr: "SrA" },
      { value: "staff-sergeant", label: "Staff Sergeant", abbr: "SSgt" },
      { value: "technical-sergeant", label: "Technical Sergeant", abbr: "TSgt" },
      { value: "master-sergeant", label: "Master Sergeant", abbr: "MSgt" },
      { value: "senior-master-sergeant", label: "Senior Master Sergeant", abbr: "SMSgt" },
      { value: "chief-master-sergeant", label: "Chief Master Sergeant", abbr: "CMSgt" },
      { value: "command-chief-master-sergeant", label: "Command Chief Master Sergeant", abbr: "CCM" },
      { value: "chief-master-sergeant-of-the-air-force", label: "Chief Master Sergeant of the Air Force", abbr: "CMSAF" },
      { value: "second-lieutenant", label: "Second Lieutenant", abbr: "2d Lt" },
      { value: "first-lieutenant", label: "First Lieutenant", abbr: "1st Lt" },
      { value: "captain", label: "Captain", abbr: "Capt" },
      { value: "major", label: "Major", abbr: "Maj" },
      { value: "lieutenant-colonel", label: "Lieutenant Colonel", abbr: "Lt Col" },
      { value: "colonel", label: "Colonel", abbr: "Col" },
      { value: "brigadier-general", label: "Brigadier General", abbr: "Brig Gen" },
      { value: "major-general", label: "Major General", abbr: "Maj Gen" },
      { value: "lieutenant-general", label: "Lieutenant General", abbr: "Lt Gen" },
      { value: "general", label: "General", abbr: "Gen" }
    ];

    const shops = ["ENGR", "DIRT", "SUPP"];
    const floors = {
      floorOneGrid: Array.from({ length: 19 }, (_, index) => String(101 + index)),
      floorTwoGrid: Array.from({ length: 19 }, (_, index) => String(201 + index))
    };
    const storageKey = "rhs-200-room-signup-v2";
    const legacyStorageKey = "rhs-200-room-signup-v1";

    const makePerson = (id, firstName, lastName, rankValue, shop) => ({
      id,
      firstName,
      lastName,
      rankValue,
      rankAbbr: rankOptions.find((rank) => rank.value === rankValue)?.abbr || "",
      shop
    });

    const initialRooms = {
      101: [makePerson("sample-101-a", "Maya", "Sullivan", "airman-first-class", "ENGR"), null],
      104: [makePerson("sample-104-a", "Ari", "Brookhalter", "staff-sergeant", "DIRT"), makePerson("sample-104-b", "Sam", "Carter", "senior-airman", "SUPP")],
      108: [null, makePerson("sample-108-b", "Nora", "Price", "technical-sergeant", "ENGR")],
      112: [makePerson("sample-112-a", "June", "Reyes", "airman", "DIRT"), null],
      116: [makePerson("sample-116-a", "Taylor", "Hayes", "captain", "SUPP"), makePerson("sample-116-b", "Chris", "Morgan", "master-sergeant", "ENGR")],
      203: [makePerson("sample-203-a", "Leo", "Foster", "senior-airman", "DIRT"), null],
      207: [makePerson("sample-207-a", "Iris", "Kim", "second-lieutenant", "SUPP"), makePerson("sample-207-b", "Max", "Allen", "staff-sergeant", "ENGR")],
      211: [null, makePerson("sample-211-b", "Ella", "Nguyen", "airman-first-class", "DIRT")],
      215: [makePerson("sample-215-a", "Rae", "Bennett", "major", "SUPP"), null],
      219: [makePerson("sample-219-a", "Kai", "Torres", "technical-sergeant", "ENGR"), makePerson("sample-219-b", "Noah", "Wright", "colonel", "SUPP")]
    };

    const rankSelect = document.querySelector("#rank");
    const firstNameInput = document.querySelector("#firstName");
    const lastNameInput = document.querySelector("#lastName");
    const shopSelect = document.querySelector("#shop");
    const personForm = document.querySelector("#personForm");
    const drawerToggle = document.querySelector("#drawerToggle");
    const resetButton = document.querySelector("#resetButton");
    const formStatus = document.querySelector("#formStatus");
    const selectedName = document.querySelector("#selectedName");
    const selectedMeta = document.querySelector("#selectedMeta");
    const openBeds = document.querySelector("#openBeds");
    const halfRooms = document.querySelector("#halfRooms");
    const fullRooms = document.querySelector("#fullRooms");
    const floorOneCount = document.querySelector("#floorOneCount");
    const floorTwoCount = document.querySelector("#floorTwoCount");

    const createRooms = () => {
      const allRooms = [...floors.floorOneGrid, ...floors.floorTwoGrid];
      return allRooms.reduce((rooms, room) => {
        rooms[room] = initialRooms[room] ? initialRooms[room].map((person) => person ? { ...person } : null) : [null, null];
        return rooms;
      }, {});
    };

    const createInitialState = () => ({
      currentUser: {
        firstName: "",
        lastName: "",
        rankValue: "airman-first-class",
        shop: "ENGR"
      },
      rooms: createRooms()
    });

    const normalizePerson = (person, room, bedIndex) => {
      if (!person) return null;
      if (typeof person === "string") {
        return makePerson(`legacy-${room}-${bedIndex}`, "", person, "airman-first-class", "ENGR");
      }
      const rankValue = person.rankValue || "airman-first-class";
      return {
        id: person.id || `person-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        firstName: person.firstName || "",
        lastName: person.lastName || "",
        rankValue,
        rankAbbr: rankOptions.find((rank) => rank.value === rankValue)?.abbr || person.rankAbbr || "",
        shop: shops.includes(person.shop) ? person.shop : "ENGR"
      };
    };

    const normalizeState = (saved) => {
      const base = createInitialState();
      const sourceRooms = saved?.rooms || saved || {};
      Object.keys(base.rooms).forEach((room) => {
        if (Array.isArray(sourceRooms[room])) {
          base.rooms[room] = [0, 1].map((bedIndex) => normalizePerson(sourceRooms[room][bedIndex], room, bedIndex));
        }
      });

      if (saved?.currentUser) {
        base.currentUser = {
          firstName: saved.currentUser.firstName || "",
          lastName: saved.currentUser.lastName || "",
          rankValue: saved.currentUser.rankValue || "airman-first-class",
          shop: shops.includes(saved.currentUser.shop) ? saved.currentUser.shop : "ENGR"
        };
      }

      return base;
    };

    const loadState = () => {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved) return normalizeState(saved);
        const legacy = JSON.parse(localStorage.getItem(legacyStorageKey));
        return legacy ? normalizeState(legacy) : createInitialState();
      } catch {
        return createInitialState();
      }
    };

    let appState = loadState();

    const saveState = () => {
      localStorage.setItem(storageKey, JSON.stringify(appState));
      window.roomSignupState = appState;
      window.roomSignupFirebasePayload = {
        currentUser: appState.currentUser,
        rooms: appState.rooms,
        updatedAt: new Date().toISOString()
      };
    };

    const rankByValue = (value) => rankOptions.find((rank) => rank.value === value) || rankOptions[0];
    const formatPerson = (person) => `${person.rankAbbr || rankByValue(person.rankValue).abbr} ${person.lastName || "Unknown"}`.toUpperCase();
    const fullPersonLabel = (person) => `${rankByValue(person.rankValue).label} ${person.firstName} ${person.lastName}, ${person.shop}`;
    const claimedCount = (room) => appState.rooms[room].filter(Boolean).length;

    const roomStatusText = (room) => {
      const taken = claimedCount(room);
      if (taken === 0) return "2 beds left";
      if (taken === 1) return "1 bed left";
      return "full";
    };

    const currentUserReady = () => Boolean(appState.currentUser.firstName.trim() && appState.currentUser.lastName.trim());

    const currentUserPerson = () => {
      const rank = rankByValue(appState.currentUser.rankValue);
      return {
        id: `person-${Date.now()}`,
        firstName: appState.currentUser.firstName.trim(),
        lastName: appState.currentUser.lastName.trim(),
        rankValue: rank.value,
        rankAbbr: rank.abbr,
        shop: appState.currentUser.shop
      };
    };

    const populateRankOptions = () => {
      rankSelect.replaceChildren(...rankOptions.map((rank) => {
        const option = document.createElement("option");
        option.value = rank.value;
        option.textContent = `${rank.label} (${rank.abbr})`;
        return option;
      }));
    };

    const syncForm = () => {
      firstNameInput.value = appState.currentUser.firstName;
      lastNameInput.value = appState.currentUser.lastName;
      rankSelect.value = appState.currentUser.rankValue;
      shopSelect.value = appState.currentUser.shop;
    };

    const updateSelectedCard = () => {
      if (!currentUserReady()) {
        selectedName.textContent = "No profile saved";
        selectedMeta.textContent = "Save a profile before assigning a bed.";
        return;
      }
      const rank = rankByValue(appState.currentUser.rankValue);
      selectedName.textContent = `${rank.abbr} ${appState.currentUser.lastName}`;
      selectedMeta.textContent = `${appState.currentUser.firstName} ${appState.currentUser.lastName}, ${appState.currentUser.shop}`;
    };

    const updateSummary = () => {
      const allRooms = [...floors.floorOneGrid, ...floors.floorTwoGrid];
      const counts = allRooms.map(claimedCount);
      const totalOpen = counts.reduce((sum, taken) => sum + (2 - taken), 0);
      const halfTotal = counts.filter((taken) => taken === 1).length;
      const fullTotal = counts.filter((taken) => taken === 2).length;
      const floorOneOpen = floors.floorOneGrid.reduce((sum, room) => sum + (2 - claimedCount(room)), 0);
      const floorTwoOpen = floors.floorTwoGrid.reduce((sum, room) => sum + (2 - claimedCount(room)), 0);

      openBeds.textContent = totalOpen;
      halfRooms.textContent = halfTotal;
      fullRooms.textContent = fullTotal;
      floorOneCount.textContent = `${floorOneOpen} beds left`;
      floorTwoCount.textContent = `${floorTwoOpen} beds left`;
    };

    const makeOccupantLabel = (person) => {
      const label = document.createElement("div");
      label.className = person ? "occupant" : "occupant is-empty";
      label.textContent = person ? formatPerson(person) : "Open bed";
      if (person) label.title = fullPersonLabel(person);
      return label;
    };

    const renderRoom = (room) => {
      const taken = claimedCount(room);
      const statusClass = taken === 2 ? "is-full" : taken === 1 ? "is-half" : "";
      const card = document.createElement("article");
      card.className = `room ${statusClass}`.trim();
      card.setAttribute("aria-label", `Room ${room}, ${roomStatusText(room)}`);

      const heading = document.createElement("div");
      heading.className = "room-number";
      heading.innerHTML = `<span>${room}</span><span class="room-count">${taken}/2</span>`;

      const occupants = document.createElement("div");
      occupants.className = "occupants";
      occupants.replaceChildren(...appState.rooms[room].map(makeOccupantLabel));

      const capacity = document.createElement("div");
      capacity.className = "capacity";

      appState.rooms[room].forEach((person, bedIndex) => {
        const bedButton = document.createElement("button");
        const isTaken = Boolean(person);
        bedButton.type = "button";
        bedButton.className = isTaken ? "bed is-taken" : "bed";
        bedButton.setAttribute("aria-label", isTaken ? `Clear room ${room}, bed ${bedIndex + 1}, currently ${fullPersonLabel(person)}` : `Assign room ${room}, bed ${bedIndex + 1}`);
        bedButton.title = isTaken ? `Clear ${formatPerson(person)}` : `Assign bed ${bedIndex + 1}`;

        bedButton.addEventListener("click", () => {
          if (isTaken) {
            appState.rooms[room][bedIndex] = null;
            formStatus.textContent = `Cleared bed ${bedIndex + 1} in room ${room}.`;
          } else if (!currentUserReady()) {
            formStatus.textContent = "Enter and save a first name and last name before assigning a bed.";
            firstNameInput.focus();
            return;
          } else {
            appState.rooms[room][bedIndex] = currentUserPerson();
            formStatus.textContent = `Assigned ${rankByValue(appState.currentUser.rankValue).abbr} ${appState.currentUser.lastName} to room ${room}.`;
          }
          saveState();
          render();
        });

        capacity.appendChild(bedButton);
      });

      card.append(heading, occupants, capacity);
      return card;
    };

    const renderFloor = (gridId, rooms) => {
      const grid = document.querySelector(`#${gridId}`);
      grid.replaceChildren(...rooms.map(renderRoom));
    };

    const render = () => {
      renderFloor("floorOneGrid", floors.floorOneGrid);
      renderFloor("floorTwoGrid", floors.floorTwoGrid);
      updateSummary();
      updateSelectedCard();
      saveState();
    };

    populateRankOptions();
    syncForm();

    drawerToggle.addEventListener("click", () => {
      const isClosed = document.body.classList.toggle("drawer-closed");
      drawerToggle.innerHTML = isClosed ? "&lsaquo;" : "&rsaquo;";
      drawerToggle.setAttribute("aria-expanded", String(!isClosed));
      drawerToggle.setAttribute("aria-label", isClosed ? "Open assignment drawer" : "Collapse assignment drawer");
    });

    personForm.addEventListener("submit", (event) => {
      event.preventDefault();
      appState.currentUser = {
        firstName: firstNameInput.value.trim(),
        lastName: lastNameInput.value.trim(),
        rankValue: rankSelect.value,
        shop: shopSelect.value
      };
      formStatus.textContent = currentUserReady() ? "Profile saved." : "First name and last name are required.";
      render();
    });

    [firstNameInput, lastNameInput, rankSelect, shopSelect].forEach((field) => {
      field.addEventListener("change", () => {
        appState.currentUser = {
          firstName: firstNameInput.value.trim(),
          lastName: lastNameInput.value.trim(),
          rankValue: rankSelect.value,
          shop: shopSelect.value
        };
        updateSelectedCard();
        saveState();
      });
    });

    [firstNameInput, lastNameInput].forEach((field) => {
      field.addEventListener("input", () => {
        appState.currentUser = {
          firstName: firstNameInput.value.trim(),
          lastName: lastNameInput.value.trim(),
          rankValue: rankSelect.value,
          shop: shopSelect.value
        };
        updateSelectedCard();
        saveState();
      });
    });

    resetButton.addEventListener("click", () => {
      appState.rooms = createRooms();
      formStatus.textContent = "Board reset to sample room assignments.";
      render();
    });

    render();
  </script>
</body>
</html>
