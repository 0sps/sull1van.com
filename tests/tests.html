    <script>
        // ── THEME TOGGLE ─────────────────────────────────────────────
        if (localStorage.getItem('theme') === 'light' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.add('light-mode');
        }

        window.toggleLayout = function() {
            const layout = document.querySelector('.layout');
            layout.classList.toggle('is-grid-view');
            const isGrid = layout.classList.contains('is-grid-view');
            document.getElementById('grid-icon').style.display = isGrid ? 'none' : 'block';
            document.getElementById('list-icon').style.display = isGrid ? 'block' : 'none';
        }

        window.toggleTheme = function () {
            const root = document.documentElement;
            root.classList.toggle('light-mode');
            const isLight = root.classList.contains('light-mode');
            document.getElementById('moon-icon').style.display = isLight ? 'none' : 'block';
            document.getElementById('sun-icon').style.display = isLight ? 'block' : 'none';

            refreshThemeCache();
            if (activeCategory) applyFilters();
            if (currentTestName) openTest(currentTestName);

            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        };

        // ── INIT ─────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            refreshThemeCache();
            const isLight = document.documentElement.classList.contains('light-mode');
            document.getElementById('moon-icon').style.display = isLight ? 'none' : 'block';
            document.getElementById('sun-icon').style.display = isLight ? 'block' : 'none';
        });

        // ── DATA & STATE ──────────────────────────────────────────────
        let allTests = [];          // [{name, unit, range, type, points, numericPts, category}]
        let filteredTests = [];
        let activeCategory = 'All';
        let currentTestName = null;
        let currentChart = null;
        let sparklineCharts = {};   // id -> Chart instance (for cleanup)
        let _dataLoaded = false;

        // ── THEME COLOR CACHE ─────────────────────────────────────────
        // Populated once on init and refreshed on every theme toggle.
        // Avoids calling getComputedStyle() inside tight render loops.
        let themeCache = {};
        const THEME_VARS = [
            '--green', '--red', '--accent', '--muted', '--text', '--bg',
            '--tooltip-bg', '--card-border', '--chart-grid'
        ];
        function refreshThemeCache() {
            const style = getComputedStyle(document.documentElement);
            THEME_VARS.forEach(v => { themeCache[v] = style.getPropertyValue(v).trim(); });
        }

        // ── SAFE ISO DATE PARSER ──────────────────────────────────────
        // new Date('YYYY-MM-DD') is UTC in all browsers; this returns a
        // local-midnight Date so sort order and display stay consistent.
        function parseISODate(str) {
            if (!str) return new Date(NaN);
            const parts = String(str).split('-');
            if (parts.length === 3) {
                return new Date(+parts[0], +parts[1] - 1, +parts[2]);
            }
            return new Date(str); // fallback for unexpected formats
        }

        // Qualitative result normalization
        const QUAL_NEGATIVE = ['nonreactive', 'negative', 'notdetected', 'nondetected', 'undetected', 'absent'];
        const QUAL_POSITIVE = ['reactive', 'positive', 'detected', 'present'];

        function qualStatus(result) {
            if (!result) return 'unknown';
            // Strip spaces and hyphens so "Non-Reactive" becomes "nonreactive"
            const r = String(result).toLowerCase().replace(/[\s-]/g, '');
            // Always check negative strictly first. "nonreactive" contains "reactive".
            if (QUAL_NEGATIVE.some(k => r.includes(k))) return 'clear';
            if (QUAL_POSITIVE.some(k => r.includes(k))) return 'reactive';
            return 'unknown';
        }

        function qualLabel(status)      { return status === 'clear' ? 'CLEAR' : status === 'reactive' ? '\u26a0 REACTIVE' : '?'; }
        function qualBadge(status)      { return status === 'clear' ? 'CLEAR' : status === 'reactive' ? 'REACTIVE' : 'UNKNOWN'; }
        function qualColorClass(status) { return status === 'clear' ? 'c-green' : status === 'reactive' ? 'c-red' : 'c-amber'; }
        function qualBadgeClass(status) { return status === 'clear' ? 'badge-green' : status === 'reactive' ? 'badge-red' : 'badge-amber'; }

        // Category taxonomy
        const CATEGORIES = {
            'STDs': [
                'HIV', 'HEPATITIS', 'SYPHILIS', 'CHLAMYDIA', 'GONORRHEA', 'HSV', 'TRICHOMONAS'
            ],
            'Hormones': [
                'TESTOSTERONE', 'TSH', 'FREE T4', 'T3', 'DHEA', 'CORTISOL', 'ESTROGEN', 'PROGESTERONE', 'LH', 'FSH'
            ],
            'Metabolic': [
                'GLUCOSE', 'HBA1C', 'HEMOGLOBIN A1C', 'INSULIN', 'TRIGLYCERIDES', 'CHOLESTEROL', 'HDL', 'LDL'
            ],
            'Liver': [
                'ALT', 'AST', 'ALKALINE PHOSPHATASE', 'BILIRUBIN', 'ALBUMIN', 'TOTAL PROTEIN', 'GLOBULIN', 'A/G RATIO'
            ],
            'Kidney': [
                'CREATININE', 'BUN', 'GFR', 'B/C RATIO', 'URINE'
            ],
            'CBC': [
                'WBC', 'RBC', 'HGB', 'HCT', 'MCV', 'MCH', 'MCHC', 'PLT', 'RDW', 'NEU', 'LYMPH', 'MONO', 'EOS', 'BASO', 'IMMGRN', 'MPV', 'NRBC'
            ],
            'Electrolytes': [
                'SODIUM', 'POTASSIUM', 'CHLORIDE', 'CO2', 'CALCIUM', 'PHOSPHATE', 'MAGNESIUM'
            ],
            'Vitamins': [
                'VIT', 'VITAMIN', 'ZINC', 'IRON', 'FERRITIN', 'B12', 'FOLATE'
            ],
        };

        const HIGHER_IS_BETTER = new Set([
            'HDL', 'HDL CHOLESTEROL', 'VIT D', 'VITAMIN D', 'GFR', 'TESTOSTERONE',
            'FERRITIN', 'B12', 'FOLATE', 'ALBUMIN', 'HGB', 'RBC'
        ]);

        function trendIsGood(testName, diff) {
            if (diff === 0) return null;
            const n = testName.toUpperCase();
            const higherBetter = [...HIGHER_IS_BETTER].some(k => n.includes(k));
            return higherBetter ? diff > 0 : diff < 0;
        }

        function categorize(name) {
            if (!name || typeof name !== 'string') return 'Other';
            const n = name.toUpperCase();
            for (const [cat, keywords] of Object.entries(CATEGORIES)) {
                if (keywords.some(k => n.includes(k))) return cat;
            }
            return 'Other';
        }

        function cleanNumber(str) {
            if (str === null || str === undefined) return null;
            const s = String(str).replace(/[<>^=\s]/g, '').replace(/[^0-9.\-]/g, '');
            const n = parseFloat(s);
            return isNaN(n) ? null : n;
        }

        function parseRange(rangeStr) {
            if (!rangeStr || typeof rangeStr !== 'string') return null;
            const r = rangeStr.trim();
            // "min-max" - careful with negative numbers
            const dash = r.match(/^([0-9.]+)\s*-\s*([0-9.]+)$/);
            if (dash) return { min: parseFloat(dash[1]), max: parseFloat(dash[2]) };
            // "<X" or "<=X"
            const lt = r.match(/^<=?\s*([0-9.]+)$/);
            if (lt) return { max: parseFloat(lt[1]) };
            // ">X" or ">=X"
            const gt = r.match(/^>=?\s*([0-9.]+)$/);
            if (gt) return { min: parseFloat(gt[1]) };
            return null;
        }

        function isInRange(val, parsed) {
            if (!parsed) return null;
            if (parsed.min !== undefined && val < parsed.min) return 'low';
            if (parsed.max !== undefined && val > parsed.max) return 'high';
            return 'normal';
        }

        // ── FIREBASE READINESS PROMISE ────────────────────────────────
        // Created here (classic script) so it exists before the module
        // script runs. The module resolves it once Firestore is initialised.
        window._labsDbPromise = new Promise(resolve => { window._labsDbResolve = resolve; });

        // ── LOAD DATA (Firestore) ─────────────────────────────────────
        async function loadData(forceRefresh = false) {
            // If called via event listener, the first arg is an Event object.
            // We only want a force refresh if explicitly passed boolean true.
            if (forceRefresh instanceof Event) forceRefresh = false;

            if (_dataLoaded && !forceRefresh) return;

            const CACHE_KEY = 'labs_cache_v1';
            const CACHE_TIME_KEY = 'labs_cache_time';
            const ONE_YEAR_MS = 365 * 24 * 60 * 60 * 1000;

            try {
                const cachedData = localStorage.getItem(CACHE_KEY);
                const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
                const now = Date.now();

                // 1. Try Cache First (if not forcing a refresh)
                if (!forceRefresh && cachedData && cachedTime) {
                    const age = now - parseInt(cachedTime);
                    if (age < ONE_YEAR_MS) {
                        allTests = JSON.parse(cachedData);
                        _dataLoaded = true;
                        buildChips();
                        applyFilters();
                        const loadingEl = document.getElementById('loadingState');
                        if (loadingEl) loadingEl.remove();

                        // Auto-select on desktop if nothing selected
                        if (isDesktop() && !currentTestName) {
                            setTimeout(() => {
                                const firstMulti = allTests.find(t => t.numericPts && t.numericPts.length > 1);
                                if (firstMulti) openTest(firstMulti.name);
                                else if (allTests.length > 0) openTest(allTests[0].name);
                            }, 150);
                        }
                        return;
                    }
                }

                // 2. Cache Miss or Force Refresh: Fetch from Firebase
                const loadingEl = document.getElementById('loadingState');
                if (loadingEl) {
                    loadingEl.innerHTML = '<div class="spinner"></div>Refreshing from cloud…';
                } else {
                    // Re-create loading state if it was removed
                    const panel = document.getElementById('panelList');
                    panel.innerHTML = '<div class="loading-state" id="loadingState"><div class="spinner"></div>Refreshing from cloud…</div>';
                }

                // Wait for Firestore to be ready
                if (window._labsDbPromise) {
                    await window._labsDbPromise;
                } else {
                    let attempts = 0;
                    while (!window._labsDb && attempts < 50) {
                        await new Promise(r => setTimeout(r, 100));
                        attempts++;
                    }
                }
                if (!window._labsDb) throw new Error('Firebase did not initialise in time.');

                const { getDocs, collection } = window._labsFirestore;
                const snapshot = await getDocs(collection(window._labsDb, 'Labs'));

                if (snapshot.empty) throw new Error('No documents found in the Labs collection.');

                allTests = snapshot.docs.map(docSnap => {
                    const d = docSnap.data();
                    if (!d || !d.name) return null;

                    const points = (d.points || []).map(p => {
                        const rawResult = p.rawResult !== undefined ? p.rawResult : p.value;
                        const numVal    = cleanNumber(rawResult);
                        const isNumeric = d.type === 'numeric' || (d.type !== 'qualitative' && numVal !== null);
                        return {
                            date: p.date, rawResult,
                            numVal: isNumeric && numVal !== null ? numVal : null,
                            isNumeric,
                            rawRange: (p.rawRange && typeof p.rawRange === 'string') ? p.rawRange : null,
                            testResultId: p.testResultId || null,
                            lab: p.lab || null,
                            sourceFile: p.sourceFile || null,
                        };
                    });

                    points.sort((a, b) => parseISODate(a.date) - parseISODate(b.date));
                    const dmap = {};
                    points.forEach(p => { dmap[p.date] = p; });
                    const sortedPoints = Object.values(dmap).sort((a, b) => parseISODate(a.date) - parseISODate(b.date));

                    const numericPts = sortedPoints.filter(p => p.isNumeric && p.numVal !== null);
                    const qualPts    = sortedPoints.filter(p => !p.isNumeric);
                    let type = (numericPts.length === 0 && qualPts.length > 0) ? 'qualitative' : (numericPts.length > 0 && qualPts.length === 0 ? 'numeric' : 'mixed');

                    let bestRange = d.range ? String(d.range) : null;
                    const rp = sortedPoints.find(p => p.rawRange && isNaN(parseFloat(p.rawRange)));
                    if (rp) bestRange = rp.rawRange;

                    return {
                        name: d.name, unit: d.unit || null, range: bestRange, type,
                        points: sortedPoints, numericPts, category: categorize(d.name),
                    };
                }).filter(Boolean);

                allTests.sort((a, b) => b.points.length - a.points.length || a.name.localeCompare(b.name));

                // 3. Update Cache
                localStorage.setItem(CACHE_KEY, JSON.stringify(allTests));
                localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());

                _dataLoaded = true;
                buildChips();
                applyFilters();
                const finalLoadingEl = document.getElementById('loadingState');
                if (finalLoadingEl) finalLoadingEl.remove();

                if (isDesktop() && !currentTestName) {
                    setTimeout(() => {
                        const firstMulti = allTests.find(t => t.numericPts && t.numericPts.length > 1);
                        if (firstMulti) openTest(firstMulti.name);
                        else if (allTests.length > 0) openTest(allTests[0].name);
                    }, 150);
                }

            } catch (e) {
                console.error(e);
                const errEl = document.getElementById('loadingState');
                if (errEl) {
                    errEl.innerHTML = '<span style="color:var(--red)">⚠ Failed to load — ' + e.message + '</span>';
                }
            }
        }

        // ── CHIPS ────────────────────────────────────────────────────
        function buildChips() {
            const cats = ['All', ...Object.keys(CATEGORIES).filter(c =>
                allTests.some(t => t.category === c)
            ), 'Other'];

            const row = document.getElementById('chipRow');
            row.innerHTML = cats.map(c =>
                `<div class="chip${c === 'All' ? ' active' : ''}" data-cat="${c}" onclick="setCategory(this,'${c}')">${c}</div>`
            ).join('');
        }

        function setCategory(el, cat) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            activeCategory = cat;
            applyFilters();
        }

        // ── FILTER / RENDER LIST ────────────────────────────────────
        function onSearch() { applyFilters(); }

        function applyFilters() {
            const term = document.getElementById('testSearch').value.toLowerCase();
            filteredTests = allTests.filter(t => {
                const catOk = activeCategory === 'All' || t.category === activeCategory;
                const termOk = !term || t.name.toLowerCase().includes(term);
                return catOk && termOk;
            });
            renderList();
        }

        function renderList() {
            const panel = document.getElementById('panelList');

            // Destroy old sparklines
            Object.values(sparklineCharts).forEach(c => { try { c.destroy(); } catch (_) { } });
            sparklineCharts = {};

            // Group by category
            const byCategory = {};
            filteredTests.forEach(t => {
                if (!byCategory[t.category]) byCategory[t.category] = [];
                byCategory[t.category].push(t);
            });

            if (filteredTests.length === 0) {
                panel.innerHTML = '<div class="empty-state">No matching biomarkers</div>';
                return;
            }

            const sections = [];

            // ── HERO WIDGET ──
            const isSearching = document.getElementById('testSearch').value.trim() !== '';
            if (!isSearching && activeCategory === 'All') {
                let totalTestsCount = allTests.length;
                let latestDateStr = '';
                let totalOOR = 0;

                allTests.forEach(t => {
                    if (t.points && t.points.length > 0) {
                        const last = t.points[t.points.length - 1];
                        // Use parseISODate for reliable cross-browser date comparison
                        if (!latestDateStr || parseISODate(last.date) > parseISODate(latestDateStr)) latestDateStr = last.date;

                        if (t.type === 'qualitative') {
                            if (qualStatus(last.rawResult) === 'reactive') totalOOR++;
                        } else if (t.numericPts.length > 0) {
                            const lastNum = t.numericPts[t.numericPts.length - 1];
                            const rStr = lastNum.rawRange || t.range;
                            const parsed = parseRange(rStr);
                            if (parsed) {
                                const stat = isInRange(lastNum.numVal, parsed);
                                if (stat === 'high' || stat === 'low') totalOOR++;
                            }
                        }
                    }
                });

                sections.push(`
                <div class="hero-widget">
                    <div class="hero-glow"></div>
                    <div class="hero-content">
                        <div class="hero-kpi">
                            <div class="hero-kpi-val" style="color: ${totalOOR > 0 ? 'var(--red)' : 'var(--text)'}">${totalOOR}</div>
                            <div class="hero-kpi-lbl">Out of Range</div>
                        </div>
                        <div class="hero-kpi-divider"></div>
                        <div class="hero-kpi">
                            <div class="hero-kpi-val c-text">${totalTestsCount}</div>
                            <div class="hero-kpi-lbl">Biomarkers</div>
                        </div>
                        <div class="hero-kpi-divider"></div>
                        <div class="hero-kpi">
                            <div class="hero-kpi-val c-text" style="font-size:1.15rem; transform: translateY(2px);">${latestDateStr ? fmtDate(latestDateStr).replace(/,\s*/, '') : 'N/A'}</div>
                            <div class="hero-kpi-lbl">Last Lab</div>
                        </div>
                    </div>
                </div>
                `);
            }

            Object.entries(byCategory).forEach(([cat, tests]) => {
                sections.push(`<div class="section-label">${cat}</div>`);
                tests.forEach(t => {
                    sections.push(renderTestCard(t));
                });
            });

            panel.innerHTML = sections.join('');

            // Draw sparklines
            filteredTests.forEach(t => {
                if (t.type !== 'qualitative' && t.numericPts.length > 1) {
                    drawSparkline(t);
                }
            });
        }

        function renderTestCard(t) {
            const id = safeId(t.name);
            const isCurrent = t.name === currentTestName;
            const last = t.points[t.points.length - 1];

            if (t.type === 'qualitative') {
                // Most-recent status
                const status = qualStatus(last.rawResult);
                const badgeClass = qualBadgeClass(status);
                const badgeText = qualBadge(status);
                const checkCount = t.points.filter(p => qualStatus(p.rawResult) === 'clear').length;

                return `
      <div class="test-card${isCurrent ? ' active-card' : ''}" id="test-btn-${id}" onclick="openTest('${escStr(t.name)}')">
        <div class="test-card-inner">
            <div class="test-card-left">
              <div class="test-card-name">${t.name}</div>
              <div class="test-card-meta">
                <span>${t.points.length} ${t.points.length === 1 ? 'test' : 'tests'}</span>
                <span>${checkCount}/${t.points.length} clear</span>
              </div>
            </div>
            <div class="test-card-right">
              <span class="status-badge ${badgeClass}">${badgeText}</span>
              <span style="font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--muted)">${fmtDate(last.date)}</span>
            </div>
            <svg class="chevron" width="7" height="12" viewBox="0 0 7 12" fill="none">
              <path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
        </div>
      </div>`;
            }

            // Numeric
            const latestNumPt = [...t.numericPts].reverse()[0];
            const latestVal = latestNumPt ? latestNumPt.numVal : null;
            const rangeStr = latestNumPt?.rawRange || t.range;
            const parsed = parseRange(rangeStr);
            const status = latestVal !== null ? isInRange(latestVal, parsed) : null;

            let valColor = 'c-text';
            if (status === 'low' || status === 'high') valColor = 'c-red';
            else if (status === 'normal') valColor = 'c-green';

            const displayVal = latestVal !== null ? formatVal(latestVal) : (last.rawResult ?? '—');

            return `
    <div class="test-card${isCurrent ? ' active-card' : ''}" id="test-btn-${id}" onclick="openTest('${escStr(t.name)}')">
      <div class="test-card-inner">
          <div class="test-card-left">
            <div class="test-card-name">${t.name}</div>
            <div class="test-card-meta">
              <span>${t.numericPts.length} ${t.numericPts.length === 1 ? 'reading' : 'readings'}</span>
              ${rangeStr && typeof rangeStr === 'string' && isNaN(Number(rangeStr)) ? `<span>${rangeStr}</span>` : ''} 
            </div>
          </div>
          <div class="test-card-right" style="gap:2px;">
            <div class="latest-chip ${valColor}">${displayVal}</div>
            ${t.numericPts.length > 1 ? `<canvas id="spark-${id}" width="64" height="28" style="display:block;"></canvas>` : ''}
          </div>
          <svg class="chevron" width="7" height="12" viewBox="0 0 7 12" fill="none">
            <path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
      </div>
    </div>`;
        }

        function drawSparkline(t) {
            const id = safeId(t.name);
            const canvas = document.getElementById(`spark-${id}`);
            if (!canvas) return;

            const vals = t.numericPts.map(p => p.numVal);
            const rangeStr = t.numericPts[t.numericPts.length - 1]?.rawRange || t.range;
            const parsed = parseRange(rangeStr);
            const lastStatus = parsed ? isInRange(vals[vals.length - 1], parsed) : null;

            // Use cached theme colors — no getComputedStyle reflow per sparkline
            const lineColor = lastStatus === 'normal' ? themeCache['--green']
                : lastStatus === 'high' || lastStatus === 'low' ? themeCache['--red']
                : themeCache['--accent'];

            // Destroy any existing Chart instance for this id before creating a new one.
            // Prevents ghost instances when the list re-renders rapidly (e.g. fast search input).
            if (sparklineCharts[id]) {
                try { sparklineCharts[id].destroy(); } catch (_) { }
                delete sparklineCharts[id];
            }

            try {
                sparklineCharts[id] = new Chart(canvas.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: t.numericPts.map(p => p.date),
                        datasets: [{
                            data: vals,
                            borderColor: lineColor,
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.4,
                            fill: false,
                        }]
                    },
                    options: {
                        animation: false,
                        responsive: false,
                        plugins: { legend: { display: false }, tooltip: { enabled: false } },
                        scales: { x: { display: false }, y: { display: false } },
                    }
                });
            } catch (_) { }
        }

        // ── ACTION SHEET ─────────────────────────────────────────────
        function toggleActionSheet(show) {
            const sheet = document.getElementById('actionSheet');
            const overlay = document.getElementById('actionSheetOverlay');
            if (show) {
                sheet.classList.add('visible');
                overlay.classList.add('visible');
            } else {
                sheet.classList.remove('visible');
                overlay.classList.remove('visible');
            }
        }

        // ── OPEN TEST ────────────────────────────────────────────────
        function isDesktop() { return window.innerWidth >= 900; }

        // ── KPI STATS ENGINE ──────────────────────────────────────────
        // Single source of truth for KPI data. Both the grid HTML renderer
        // (getKPIHtml) and the DOM mutator (renderKPIs) consume this object
        // so logic changes only need to be made in one place.
        function calcTestStats(t) {
            if (t.type === 'qualitative') {
                const last = t.points[t.points.length - 1];
                const status = qualStatus(last.rawResult);
                return {
                    type: 'qualitative',
                    latestLabel: qualLabel(status),
                    latestColorClass: qualColorClass(status),
                    latestDate: fmtDate(last.date),
                    rangeText: 'Nonreactive',
                    totalCount: t.points.length,
                    // trend fields unused for qualitative but kept for consistency
                    trendVal: null,
                    trendColorClass: 'c-text',
                    trendSub: 'total tests',
                };
            }

            const pts = t.numericPts;
            if (pts.length === 0) {
                return {
                    type: 'numeric-empty',
                    latestLabel: '—', latestColorClass: 'c-text', latestDate: '',
                    rangeText: '—', unit: t.unit || '',
                    trendVal: '—', trendColorClass: 'c-text', trendSub: '',
                };
            }

            const latest = pts[pts.length - 1];
            const prev   = pts.length > 1 ? pts[pts.length - 2] : null;
            const rangeStr = latest.rawRange || t.range;
            const parsed   = parseRange(rangeStr);
            const status   = parsed ? isInRange(latest.numVal, parsed) : null;

            const latestColorClass = status === 'normal' ? 'c-green'
                : (status === 'high' || status === 'low') ? 'c-red'
                : 'c-text';

            const rangeText = (rangeStr && typeof rangeStr === 'string' && isNaN(Number(rangeStr)))
                ? rangeStr : '—';

            let trendVal = '—', trendColorClass = 'c-text', trendSub = 'Need more';
            let trendPct = null;
            if (prev) {
                const diff = latest.numVal - prev.numVal;
                if (Math.abs(diff) < 0.001) {
                    trendVal = '=';
                    trendSub = 'No change';
                } else {
                    const good = trendIsGood(t.name, diff);
                    trendColorClass = good === null ? 'c-text' : good ? 'c-green' : 'c-red';
                    // Full detail view: signed value  (+1.23 / -0.5)
                    trendVal = diff > 0 ? `+${formatVal(diff)}` : formatVal(diff);
                    trendPct = ((diff / (prev.numVal || 1)) * 100).toFixed(1);
                    trendSub = `${diff > 0 ? '↑' : '↓'} ${Math.abs(trendPct)}%`;
                }
            }

            return {
                type: 'numeric',
                latestVal: formatVal(latest.numVal),
                latestColorClass,
                latestDate: fmtDate(latest.date),
                rangeText,
                unit: t.unit || '',
                trendVal,
                trendColorClass,
                trendSub,
                // Raw diff arrow variant used in grid card compact view
                trendArrowVal: prev ? ((latest.numVal - prev.numVal) > 0 ? '▲ ' : '▼ ') + formatVal(Math.abs(latest.numVal - prev.numVal)) : null,
                prevDate: prev ? fmtDate(prev.date) : null,
                totalCount: pts.length,
            };
        }

        function getKPIHtml(t) {
            const s = calcTestStats(t);

            if (s.type === 'qualitative') {
                return `
                <div class="kpi-row grid-kpi-row">
                    <div class="kpi-box"><div class="kpi-label">Latest</div><div class="kpi-val ${s.latestColorClass}">${s.latestLabel}</div><div class="kpi-sub" style="margin-top:2px;">${s.latestDate}</div></div>
                    <div class="kpi-box"><div class="kpi-label">Target Range</div><div class="kpi-val c-text" style="font-size:0.95rem;">${s.rangeText}</div><div class="kpi-sub" style="margin-top:2px;">Ref. interval</div></div>
                    <div class="kpi-box"><div class="kpi-label">Tests</div><div class="kpi-val c-text">${s.totalCount}</div><div class="kpi-sub" style="margin-top:2px;">Total records</div></div>
                </div>`;
            }

            if (s.type === 'numeric-empty') {
                return `
                <div class="kpi-row grid-kpi-row">
                    <div class="kpi-box"><div class="kpi-label">Latest</div><div class="kpi-val c-text">—</div></div>
                    <div class="kpi-box"><div class="kpi-label">Target Range</div><div class="kpi-val c-text">—</div></div>
                    <div class="kpi-box"><div class="kpi-label">Trend</div><div class="kpi-val c-text">—</div></div>
                </div>`;
            }

            const trendHtml = s.trendArrowVal
                ? `<div class="kpi-val ${s.trendVal === '=' ? 'c-text' : s.trendColorClass}">${s.trendVal === '=' ? 'No change' : s.trendArrowVal}</div><div class="kpi-sub" style="margin-top:2px;">vs ${s.prevDate}</div>`
                : `<div class="kpi-val c-text">—</div><div class="kpi-sub" style="margin-top:2px;">Insufficient data</div>`;

            return `
            <div class="kpi-row grid-kpi-row">
                <div class="kpi-box"><div class="kpi-label">Latest</div><div class="kpi-val ${s.latestColorClass}">${s.latestVal} <span style="font-size:0.6rem;color:var(--muted)">${s.unit}</span></div><div class="kpi-sub" style="margin-top:2px;">${s.latestDate}</div></div>
                <div class="kpi-box"><div class="kpi-label">Target Range</div><div class="kpi-val c-text" style="font-size:0.95rem;">${s.rangeText}</div><div class="kpi-sub" style="margin-top:2px;">Ref. interval</div></div>
                <div class="kpi-box"><div class="kpi-label">Trend</div>${trendHtml}</div>
            </div>`;
        }

        function openTest(name) {
            const t = allTests.find(x => x.name === name);
            if (!t) return;

            if (isDesktop()) {
                const layout = document.querySelector('.layout');
                if (layout.classList.contains('is-grid-view')) {
                    // Collapse any other open card first
                    document.querySelectorAll('.test-card.expanded').forEach(el => {
                        if (el.id !== `test-btn-${safeId(name)}`) {
                            el.classList.remove('expanded');
                            el.removeAttribute('data-grid-open');
                            const container = el.querySelector('.grid-detail-container');
                            if (container) setTimeout(() => container.remove(), 370);
                        }
                    });

                    const cardId = `test-btn-${safeId(name)}`;
                    const cardEl = document.getElementById(cardId);
                    if (cardEl) {
                        // Toggle: clicking an open card collapses it
                        if (cardEl.hasAttribute('data-grid-open')) {
                            cardEl.classList.remove('expanded');
                            cardEl.removeAttribute('data-grid-open');
                            const container = cardEl.querySelector('.grid-detail-container');
                            if (container) cardEl._removeTimer = setTimeout(() => { container.remove(); cardEl._removeTimer = null; }, 370);
                            if (currentChart) { try { currentChart.destroy(); } catch (_) {} currentChart = null; }
                            currentTestName = null;
                            return;
                        }

                        currentTestName = name;
                        cardEl.setAttribute('data-grid-open', 'true');
                        if (currentChart) { try { currentChart.destroy(); } catch (_) {} currentChart = null; }

                        if (cardEl._removeTimer) {
                            clearTimeout(cardEl._removeTimer);
                            cardEl._removeTimer = null;
                        }
                        const existingContainer = cardEl.querySelector('.grid-detail-container');
                        if (existingContainer) existingContainer.remove();

                        // Build expanded content wrapper
                        const gridDetail = document.createElement('div');
                        gridDetail.className = 'grid-detail-container';
                        const inner = document.createElement('div');
                        inner.className = 'grid-detail-inner';

                        // Close button + KPI row (pure HTML — no canvas yet)
                        inner.innerHTML = `
                            <div class="grid-expand-header">
                                <button class="detail-nav-btn" style="width:28px;height:28px;" onclick="event.stopPropagation();openTest('${escStr(t.name)}')" aria-label="Close detail">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                                </button>
                            </div>
                            ${getKPIHtml(t)}
                        `;

                        gridDetail.appendChild(inner);
                        // Append to DOM BEFORE animating so content has layout
                        cardEl.appendChild(gridDetail);

                        // Force reflow, then trigger the 0fr → 1fr animation
                        void gridDetail.offsetWidth;
                        cardEl.classList.add('expanded');

                        // Render pure-HTML sections immediately (no canvas needed)
                        if (t.type === 'qualitative') {
                            renderSTDTimeline(t, inner);
                        } else {
                            if (t.numericPts.length > 0) {
                                renderGauge(t, inner);
                            }
                            renderHistoryTable(t, inner);
                        }

                        // Render Chart.js trend after animation ends so canvas has real dimensions
                        setTimeout(() => {
                            if (t.type !== 'qualitative' && t.numericPts.length > 1) {
                                renderTrendChart(t, inner);
                            }
                            cardEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                        }, 380);

                        return;
                    }
                }

                currentTestName = name;
                document.getElementById('desktopEmpty').style.display = 'none';
                const dc = document.getElementById('detailContent');
                dc.style.display = 'flex';
                dc.style.flexDirection = 'column';

                document.querySelectorAll('.test-card').forEach(el => el.classList.remove('active-card'));
                const cardId = `test-btn-${safeId(name)}`;
                const cardEl = document.getElementById(cardId);
                if (cardEl) {
                    cardEl.classList.add('active-card');
                    cardEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            } else {
                // Mobile: swap panels
                document.getElementById('panelList').classList.remove('visible');
                document.getElementById('panelDetail').classList.add('visible');
                document.getElementById('globalTopBar').style.display = 'none';
                document.getElementById('globalSearchArea').style.display = 'none';

                const dc = document.getElementById('detailContent');
                dc.style.display = 'flex';
                dc.style.flexDirection = 'column';
            }

            // Header
            document.getElementById('detailTitle').textContent = t.name;
            document.getElementById('detailUnit').textContent = t.unit || '';

            // KPIs
            renderKPIs(t);

            // Dynamic body
            const dyn = document.getElementById('detailDynamic');
            dyn.innerHTML = '';

            if (currentChart) { try { currentChart.destroy(); } catch (_) { } currentChart = null; }

            if (t.type === 'qualitative') {
                renderSTDTimeline(t, dyn);
            } else {
                if (t.numericPts.length > 0) {
                    renderGauge(t, dyn);
                    if (t.numericPts.length > 1) {
                        renderTrendChart(t, dyn);
                    }
                }
                renderHistoryTable(t, dyn);
            }

            // Scroll detail panel to top
            const dp = document.getElementById('panelDetail');
            dp.scrollTop = 0;
        }

        function renderKPIs(t) {
            // Delegate all KPI computation to the shared stats engine.
            const s = calcTestStats(t);

            const latestEl  = document.getElementById('kpiLatest');
            const latestDate = document.getElementById('kpiLatestDate');
            const rangeEl   = document.getElementById('kpiRange');
            const trendEl   = document.getElementById('kpiTrend');
            const trendSub  = document.getElementById('kpiTrendSub');

            if (s.type === 'qualitative') {
                latestEl.textContent  = s.latestLabel;
                latestEl.className    = 'kpi-val ' + s.latestColorClass;
                latestDate.textContent = s.latestDate;
                rangeEl.textContent   = s.rangeText;
                rangeEl.className     = 'kpi-val c-text';
                trendEl.textContent   = String(s.totalCount);
                trendEl.className     = 'kpi-val c-text';
                trendSub.textContent  = s.trendSub;
                return;
            }

            if (s.type === 'numeric-empty') {
                latestEl.textContent  = '—'; latestEl.className = 'kpi-val c-text';
                latestDate.textContent = '';
                rangeEl.textContent   = '—'; rangeEl.className  = 'kpi-val c-text';
                trendEl.textContent   = '—'; trendEl.className  = 'kpi-val c-text';
                trendSub.textContent  = '';
                return;
            }

            // Numeric
            latestEl.textContent  = s.latestVal;
            latestEl.className    = 'kpi-val ' + s.latestColorClass;
            latestDate.textContent = s.latestDate;
            rangeEl.textContent   = s.rangeText;
            rangeEl.className     = 'kpi-val c-text';
            trendEl.textContent   = s.trendVal;
            trendEl.className     = `kpi-val ${s.trendColorClass}`;
            trendSub.textContent  = s.trendSub;
        }

        function renderGauge(t, container) {
            const last = t.numericPts[t.numericPts.length - 1];
            const rangeStr = last?.rawRange || t.range;
            const parsed = parseRange(rangeStr);
            if (!parsed) return;

            const val = last.numVal;
            const status = isInRange(val, parsed);

            // Determine extent
            const hasMin = parsed.min !== undefined;
            const hasMax = parsed.max !== undefined;
            const rangeMin = hasMin ? parsed.min : 0;
            const rangeMax = hasMax ? parsed.max : (val * 1.5 || 1);
            const trackMin = rangeMin - (rangeMax - rangeMin) * 0.25;
            const trackMax = rangeMax + (rangeMax - rangeMin) * 0.25;
            const trackRange = trackMax - trackMin;

            const zoneLeft = Math.max(0, ((rangeMin - trackMin) / trackRange) * 100);
            const zoneRight = Math.min(100, ((rangeMax - trackMin) / trackRange) * 100);
            const zoneWidth = zoneRight - zoneLeft;
            const markerPct = Math.min(100, Math.max(0, ((val - trackMin) / trackRange) * 100));

            const zoneColor = status === 'normal' ? 'rgba(31,203,122,0.35)' : 'rgba(79,156,248,0.2)';
            const markerColor = status === 'normal' ? 'var(--green)' : status === 'high' || status === 'low' ? 'var(--red)' : 'var(--accent)';

            container.insertAdjacentHTML('beforeend', `
      <div class="range-bar-section">
        <div class="range-bar-card">
          <div class="range-bar-label">Position in range</div>
          <div class="gauge-track">
            <div class="gauge-fill-zone" style="left:${zoneLeft}%;width:${zoneWidth}%;background:${zoneColor};"></div>
            <div class="gauge-marker" style="left:${markerPct}%;box-shadow:0 0 0 2px ${markerColor};"></div>
            <div style="position:absolute; top:20px; left:${markerPct}%; transform:translateX(-50%); color:${markerColor}; font-weight:700; font-family:'Syne', sans-serif; font-size:1.15rem;">${formatVal(val)}</div>
          </div>
          <div class="gauge-labels" style="margin-top:22px;">
            <span>${hasMin ? rangeMin : '—'}</span>
            <span>${hasMax ? rangeMax : '—'}</span>
          </div>
        </div>
      </div>
    `);
        }

        function renderTrendChart(t, container) {
            const canvasId = 'trendChart_' + safeId(t.name);
            container.insertAdjacentHTML('beforeend', `
      <div class="detail-divider">Trend over time</div>
      <div class="chart-section">
        <div class="chart-card">
          <div class="chart-inner"> 
            <canvas id="${canvasId}"></canvas>
          </div>
        </div>
      </div>
    `);

            const labels = t.numericPts.map(p => fmtDate(p.date));
            const vals = t.numericPts.map(p => p.numVal);
            const rangeStr = t.numericPts[t.numericPts.length - 1]?.rawRange || t.range;
            const parsed = parseRange(rangeStr);

            // Point colors — use cached theme vars (no getComputedStyle reflow per point)
            const pointColors = vals.map(v => {
                if (!parsed) return themeCache['--accent'];
                const s = isInRange(v, parsed);
                return s === 'normal' ? themeCache['--green']
                    : s === 'high' || s === 'low' ? themeCache['--red']
                    : themeCache['--accent'];
            });

            const lastStatus = parsed ? isInRange(vals[vals.length - 1], parsed) : null;
            // Use cached theme colors to avoid getComputedStyle reflow on every chart render
            const lineColor = lastStatus === 'normal' ? themeCache['--green']
                : lastStatus ? themeCache['--red']
                : themeCache['--accent'];

            const ctx = document.getElementById(canvasId);
            if (!ctx) return;

            const grd = ctx.getContext('2d').createLinearGradient(0, 0, 0, 220);
            grd.addColorStop(0, lineColor + '33');
            grd.addColorStop(1, lineColor + '00');

            const datasets = [{
                data: vals,
                borderWidth: 2.5,
                segment: {
                    borderColor: seg => pointColors[seg.p1DataIndex]
                },
                pointBackgroundColor: pointColors,
                pointBorderColor: getCssVar('--bg'),
                pointBorderWidth: 1.5,
                pointRadius: 5,
                pointHoverRadius: 7,
                fill: true,
                backgroundColor: grd,
                tension: 0.35,
            }];

            if (parsed) {
                if (parsed.min !== undefined) {
                    datasets.push({
                        data: Array(labels.length).fill(parsed.min),
                        borderColor: 'rgba(255,255,255,0.15)',
                        borderWidth: 1,
                        segment: { borderDash: () => [4, 4] },
                        pointRadius: 0,
                        fill: false,
                        tension: 0,
                        label: 'Min',
                    });
                }
                if (parsed.max !== undefined) {
                    datasets.push({
                        data: Array(labels.length).fill(parsed.max),
                        borderColor: 'rgba(255,255,255,0.15)',
                        borderWidth: 1,
                        segment: { borderDash: () => [4, 4] },
                        pointRadius: 0,
                        fill: false,
                        tension: 0,
                        label: 'Max',
                    });
                }
            }

            currentChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: themeCache['--tooltip-bg'],
                            titleColor: themeCache['--text'],
                            bodyColor: themeCache['--muted'],
                            borderColor: themeCache['--card-border'],
                            borderWidth: 1,
                            padding: 10,
                            titleFont: { family: "'DM Mono', monospace", size: 11 },
                            bodyFont: { family: "'DM Mono', monospace", size: 12 },
                            callbacks: {
                                title: items => items[0].label,
                                label: item => item.datasetIndex === 0
                                    ? ` ${item.raw}${t.unit ? ' ' + t.unit : ''}`
                                    : ` ${item.dataset.label}: ${item.raw}`,
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            border: { display: false },
                            ticks: {
                                color: themeCache['--muted'],
                                font: { family: "'DM Mono', monospace", size: 10 },
                                maxRotation: 0,
                                maxTicksLimit: 6,
                            }
                        },
                        y: {
                            grid: { color: themeCache['--chart-grid'], drawBorder: false },
                            border: { display: false },
                            ticks: {
                                color: themeCache['--muted'],
                                font: { family: "'DM Mono', monospace", size: 10 },
                            }
                        }
                    }
                }
            });
        }

        function renderSTDTimeline(t, container) {
            const rows = t.points.map(p => {
                const status = qualStatus(p.rawResult);
                const barClass = status === 'clear' ? 'clear' : status === 'reactive' ? 'reactive' : 'unknown';
                const label = status === 'clear' ? '● Nonreactive / Clear'
                    : status === 'reactive' ? '● Reactive / Detected'
                        : `● ${p.rawResult}`;
                return `
        <div class="std-row">
          <div class="std-date">${fmtDate(p.date)}</div>
          <div class="std-bar ${barClass}">
            <div class="std-dot"></div>${label}
          </div>
        </div>`;
            }).join('');

            container.insertAdjacentHTML('beforeend', `
      <div class="std-timeline">
        <div class="std-timeline-card">
          <div class="std-timeline-label">Test history</div>
          ${rows}
        </div>
      </div>
    `);
        }

        function renderHistoryTable(t, container) {
            const pts = t.type === 'qualitative' ? [] : t.numericPts;
            if (pts.length === 0) return;

            const rows = [...pts].reverse().map((p, i, arr) => {
                const prev = arr[i + 1]; // reversed, so prev is next in array
                const rangeStr = p.rawRange || t.range;
                const parsed = parseRange(rangeStr);
                const status = parsed ? isInRange(p.numVal, parsed) : null;

                let deltaHtml = '';
                if (prev) {
                    const diff = p.numVal - prev.numVal;
                    if (Math.abs(diff) < 0.001) {
                        deltaHtml = `<span class="hist-delta delta-flat">=</span>`;
                    } else if (diff > 0) {
                        deltaHtml = `<span class="hist-delta delta-up">↑ +${formatVal(diff)}</span>`;
                    } else {
                        deltaHtml = `<span class="hist-delta delta-down">↓ ${formatVal(diff)}</span>`;
                    }
                }

                const valColor = status === 'normal' ? 'c-green' : status === 'high' || status === 'low' ? 'c-red' : 'c-text';

                return `
        <div class="history-row">
          <div class="hist-date">${fmtDate(p.date)}</div>
          <div class="hist-val ${valColor}">${formatVal(p.numVal)}</div>
          ${deltaHtml}
        </div>`;
            }).join('');

            container.insertAdjacentHTML('beforeend', `
      <div class="detail-divider" style="margin-top:8px;">All readings</div>
      <div class="history-section">
        <div class="history-header">
          <span>Date</span>
          <span>Value</span>
          <span>Change</span>
        </div>
        ${rows}
      </div>
    `);
        }

        // ── NAVIGATION ───────────────────────────────────────────────
        function goBack() {
            if (isDesktop()) return; // no back on desktop
            document.getElementById('panelDetail').classList.remove('visible');
            document.getElementById('panelList').classList.add('visible');
            document.getElementById('globalTopBar').style.display = '';
            document.getElementById('globalSearchArea').style.display = '';
            if (currentChart) { try { currentChart.destroy(); } catch (_) { } currentChart = null; }
            currentTestName = null;
        }

        // ── UTILS ─────────────────────────────────────────────────────
        // getCssVar kept for any one-off reads (e.g. gauge marker color);
        // hot render paths must use themeCache instead.
        function getCssVar(name) {
            return themeCache[name] ?? getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
        function safeId(name) { return name.replace(/[^a-zA-Z0-9]/g, '_'); }
        function escStr(name) {
            return String(name)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }
        function formatVal(v) {
            if (v === null || v === undefined) return '—';
            if (Math.abs(v) >= 1000) return v.toFixed(0);
            if (Number.isInteger(v)) return String(v);
            const s = v.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
            return s;
        }
        function fmtDate(d) {
            if (!d) return '';
            const parts = d.replace(/-/g, '/').split('/');
            if (parts.length === 3) {
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const m = parseInt(parts[1]) - 1;
                if (m < 0 || m > 11) return d; // guard against malformed month
                return `${months[m]} '${parts[0].slice(2)}`;
            }
            return d;
        }

        // ── ADD RESULT DRAWER ─────────────────────────────────────────
        let _addSheetRowCounter = 0;

        function getTestNames() {
            // Build a sorted, unique list of all known test names for the dropdown
            if (allTests && allTests.length > 0) {
                return allTests.map(t => t.name).sort((a, b) => a.localeCompare(b));
            }
            return [];
        }

        function buildTestSelect() {
            const names = getTestNames();
            let opts = '<option value="" disabled selected>Select test…</option>';
            names.forEach(n => {
                opts += `<option value="${escStr(n)}">${escStr(n)}</option>`;
            });
            return opts;
        }

        function addResultRow() {
            const container = document.getElementById('addRowsContainer');
            const id = ++_addSheetRowCounter;
            const div = document.createElement('div');
            div.className = 'add-result-row';
            div.id = `add-row-${id}`;
            div.innerHTML = `
                <select>${buildTestSelect()}</select>
                <input type="text" placeholder="Result…">
                <button class="add-row-remove" onclick="removeResultRow(${id})" aria-label="Remove row">×</button>
            `;
            container.appendChild(div);
        }

        function removeResultRow(id) {
            const row = document.getElementById(`add-row-${id}`);
            if (row) row.remove();
        }

        function openAddSheet() {
            // Reset the form
            const dateInput = document.getElementById('addResultDate');
            dateInput.value = new Date().toISOString().split('T')[0];
            const container = document.getElementById('addRowsContainer');
            container.innerHTML = '';
            _addSheetRowCounter = 0;

            // Add one blank row to start
            addResultRow();

            // Show the drawer
            document.getElementById('addSheet').classList.add('visible');
            document.getElementById('addSheetOverlay').classList.add('visible');
        }

        function addSheetHasData() {
            const rows = document.querySelectorAll('#addRowsContainer .add-result-row');
            for (const row of rows) {
                const sel = row.querySelector('select');
                const inp = row.querySelector('input');
                if ((sel && sel.value) || (inp && inp.value.trim())) return true;
            }
            return false;
        }

        function closeAddSheet() {
            document.getElementById('addSheet').classList.remove('visible');
            document.getElementById('addSheetOverlay').classList.remove('visible');
        }

        function tryCloseAddSheet() {
            if (addSheetHasData()) {
                showConfirm({
                    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
                    iconColor: 'var(--amber)',
                    title: 'Discard changes?',
                    body: 'You have unsaved data. Are you sure you want to close without saving?',
                    primary: { label: 'Discard', className: 'confirm-btn-danger', action: () => { dismissConfirm(); closeAddSheet(); } },
                    secondary: { label: 'Keep editing', className: 'confirm-btn-secondary', action: dismissConfirm },
                });
            } else {
                closeAddSheet();
            }
        }

        // ── CUSTOM CONFIRM DIALOG ─────────────────────────────────────
        function showConfirm({ icon, iconColor, title, body, primary, secondary }) {
            const overlay = document.getElementById('confirmOverlay');
            document.getElementById('confirmIcon').innerHTML = icon;
            document.getElementById('confirmIcon').style.color = iconColor || 'var(--accent)';
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmBody').textContent = body;

            const actions = document.getElementById('confirmActions');
            actions.innerHTML = '';

            if (secondary) {
                const btn = document.createElement('button');
                btn.className = `confirm-btn ${secondary.className}`;
                btn.textContent = secondary.label;
                btn.onclick = secondary.action;
                actions.appendChild(btn);
            }

            const pBtn = document.createElement('button');
            pBtn.className = `confirm-btn ${primary.className}`;
            pBtn.textContent = primary.label;
            pBtn.onclick = primary.action;
            actions.appendChild(pBtn);

            overlay.classList.add('visible');
        }

        function dismissConfirm() {
            document.getElementById('confirmOverlay').classList.remove('visible');
        }

        // ── SAVE RESULTS ──────────────────────────────────────────────
        async function handleSaveResults() {
            const dateVal = document.getElementById('addResultDate').value;
            if (!dateVal) {
                showConfirm({
                    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
                    iconColor: 'var(--amber)',
                    title: 'Missing date',
                    body: 'Please select a date for this test before saving.',
                    primary: { label: 'OK', className: 'confirm-btn-primary', action: dismissConfirm },
                });
                return;
            }

            // Collect valid rows
            const rows = document.querySelectorAll('#addRowsContainer .add-result-row');
            const entries = [];
            for (const row of rows) {
                const sel = row.querySelector('select');
                const inp = row.querySelector('input');
                const name = sel ? sel.value : '';
                const val = inp ? inp.value.trim() : '';
                if (name && val) entries.push({ name, value: val });
            }

            if (entries.length === 0) {
                showConfirm({
                    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
                    iconColor: 'var(--amber)',
                    title: 'No results entered',
                    body: 'Please select at least one test and enter a result value.',
                    primary: { label: 'OK', className: 'confirm-btn-primary', action: dismissConfirm },
                });
                return;
            }

            // Show final confirmation before saving
            showConfirm({
                icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`,
                iconColor: 'var(--accent)',
                title: 'Save these results?',
                body: `${entries.length} result${entries.length > 1 ? 's' : ''} will be saved for ${dateVal}.`,
                secondary: { label: 'Cancel', className: 'confirm-btn-secondary', action: dismissConfirm },
                primary: { label: 'Save', className: 'confirm-btn-primary', action: () => { dismissConfirm(); executeFirebaseSave(dateVal, entries); } },
            });
        }

        async function executeFirebaseSave(dateVal, entries) {
            const saveBtn = document.getElementById('addSaveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving…';

            try {
                if (!window._labsDb || !window._labsFirestore) {
                    throw new Error('Firebase is not ready. Please refresh and try again.');
                }

                const { getDocs, collection, query, where, doc, updateDoc, arrayUnion, setDoc } = window._labsFirestore;

                // For each entry, find the matching document in Firestore and append the new point
                for (const entry of entries) {
                    const q = query(collection(window._labsDb, 'Labs'), where('name', '==', entry.name));
                    const snap = await getDocs(q);

                    const newPoint = {
                        date: dateVal,
                        rawResult: entry.value,
                        lab: 'manual_entry',
                        sourceFile: 'user_input',
                        testResultId: `manual_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
                    };

                    if (!snap.empty) {
                        // Document exists — append the new point
                        const docRef = snap.docs[0].ref;
                        await updateDoc(docRef, { points: arrayUnion(newPoint) });
                    } else {
                        // New test — create a new document
                        const newDocRef = doc(collection(window._labsDb, 'Labs'));
                        await setDoc(newDocRef, {
                            name: entry.name,
                            unit: null,
                            range: null,
                            type: 'numeric',
                            points: [newPoint],
                        });
                    }
                }

                // Success — close drawer, invalidate cache, reload data, show toast
                closeAddSheet();
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Results';

                // Invalidate cache so next load pulls fresh data
                localStorage.removeItem('labs_cache_v1');
                localStorage.removeItem('labs_cache_time');
                _dataLoaded = false;
                loadData(true);

                // Show success toast
                const toast = document.getElementById('successToast');
                toast.classList.add('visible');
                setTimeout(() => toast.classList.remove('visible'), 3000);

            } catch (e) {
                console.error('Save failed:', e);
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Results';

                showConfirm({
                    icon: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
                    iconColor: 'var(--red)',
                    title: 'Save failed',
                    body: e.message || 'Something went wrong. Please try again.',
                    primary: { label: 'OK', className: 'confirm-btn-primary', action: dismissConfirm },
                });
            }
        }

        // ── SUCCESS TOAST ─────────────────────────────────────────────
        function showSuccessToast(message) {
            const toast = document.getElementById('successToast');
            toast.textContent = message || 'Saved!';
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        // ── INIT ─────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', loadData);
        // Re-triggered after Google sign-in (dispatched by the Firebase module below)
        document.addEventListener('labs:reload', loadData);
    </script>

        };
    </script>
