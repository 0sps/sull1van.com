<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Portal | Sean's Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --text: rgba(255, 255, 255, 0.96);
            --muted: rgba(255, 255, 255, 0.76);
            --faint: rgba(255, 255, 255, 0.58);
            --line: rgba(255, 255, 255, 0.18);
            --line-strong: rgba(255, 255, 255, 0.28);
            --glass: rgba(89, 142, 219, 0.24);
            --glass-strong: rgba(79, 128, 202, 0.34);
            --shadow: 0 28px 70px rgba(34, 74, 138, 0.24);
            --shadow-soft: 0 18px 40px rgba(34, 74, 138, 0.16);
            --pill: 999px;
            --radius-xl: 34px;
            --radius-l: 26px;
            --spring: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            background:
                radial-gradient(circle at 26% 14%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.12) 18%, transparent 36%),
                radial-gradient(circle at 20% 28%, rgba(255, 247, 210, 0.32), transparent 22%),
                radial-gradient(circle at 78% 24%, rgba(144, 196, 255, 0.28), transparent 34%),
                radial-gradient(circle at 24% 74%, rgba(125, 178, 255, 0.16), transparent 26%),
                linear-gradient(180deg, #8db8eb 0%, #6f9edd 34%, #5f8fd3 65%, #6f9fe2 100%);
            background-color: #76a3e0;
        }

        body {
            min-height: 100dvh;
            color: var(--text);
            font-family: var(--font-body);
            overflow-x: hidden;
            position: relative;
        }

        .sky,
        .vignette,
        .grain,
        .flare {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .sky {
            z-index: -4;
            background:
                radial-gradient(circle at 72% 30%, rgba(124, 183, 255, 0.28), transparent 34%),
                radial-gradient(circle at 12% 80%, rgba(255, 255, 255, 0.12), transparent 22%);
            filter: blur(36px);
            animation: drift 24s ease-in-out infinite alternate;
        }

        .flare {
            z-index: -3;
            background:
                radial-gradient(circle at 26% 14%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.22) 10%, transparent 22%),
                radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.18), transparent 4%),
                radial-gradient(circle at 38% 36%, rgba(255, 255, 255, 0.14), transparent 5%),
                radial-gradient(circle at 58% 58%, rgba(255, 255, 255, 0.12), transparent 6%);
            filter: blur(2px);
            opacity: 0.95;
        }

        .vignette {
            z-index: -2;
            background: radial-gradient(circle, transparent 46%, rgba(63, 102, 171, 0.18) 100%);
        }

        .grain {
            z-index: -1;
            opacity: 0.035;
            mix-blend-mode: soft-light;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.68' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        @keyframes drift {
            from { transform: scale(1) translate(0, 0); }
            to { transform: scale(1.06) translate(20px, 10px); }
        }

        .page {
            width: min(980px, calc(100% - 26px));
            margin: 0 auto;
            padding: calc(28px + env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom));
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shell {
            width: 100%;
            display: grid;
            gap: 20px;
        }

        .hero {
            text-align: left;
            padding: 28px 20px 8px;
            text-shadow: 0 2px 18px rgba(255, 255, 255, 0.18);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: clamp(3rem, 8vw, 5.8rem);
            line-height: 0.92;
            letter-spacing: -0.07em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .tiles-panel {
            padding: 16px;
            border-radius: 38px;
            background: linear-gradient(180deg, rgba(132, 178, 236, 0.1), rgba(101, 149, 220, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1.5px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(14px) saturate(135%);
            -webkit-backdrop-filter: blur(14px) saturate(135%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                inset 0 -12px 22px rgba(60, 103, 176, 0.04),
                0 16px 34px rgba(65, 108, 177, 0.12);
        }

        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .tile {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
            padding: 22px;
            border-radius: var(--radius-xl);
            color: var(--text);
            text-decoration: none;
            background:
                radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.28), transparent 30%),
                radial-gradient(circle at 78% 88%, rgba(255, 255, 255, 0.1), transparent 26%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08) 36%, rgba(255, 255, 255, 0.04) 100%),
                linear-gradient(180deg, rgba(120, 170, 236, 0.44), rgba(72, 122, 204, 0.36));
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-top: 1.5px solid rgba(255, 255, 255, 0.34);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.34),
                inset 0 18px 28px rgba(255, 255, 255, 0.08),
                inset 0 -18px 30px rgba(40, 79, 145, 0.18),
                0 20px 42px rgba(72, 118, 192, 0.22),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px) saturate(155%);
            -webkit-backdrop-filter: blur(20px) saturate(155%);
            overflow: hidden;
            transform: translateY(18px) scale(0.985);
            opacity: 0;
            animation: tile-in 620ms var(--spring) forwards;
            transition:
                transform 240ms var(--spring),
                box-shadow 240ms var(--spring),
                filter 240ms var(--spring),
                background 240ms var(--spring),
                border-color 240ms var(--spring),
                backdrop-filter 240ms var(--spring),
                -webkit-backdrop-filter 240ms var(--spring);
        }

        .tile:nth-child(2) { animation-delay: 90ms; }
        .tile:nth-child(3) { animation-delay: 180ms; }
        .tile:nth-child(4) { animation-delay: 270ms; }

        .tile::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.24), transparent 36%),
                radial-gradient(circle at 22% 18%, rgba(255, 255, 255, 0.14), transparent 24%);
            pointer-events: none;
            transition: opacity 240ms var(--spring), transform 240ms var(--spring);
        }

        .tile::after {
            content: "";
            position: absolute;
            right: -18%;
            bottom: -34%;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2), transparent 66%);
            pointer-events: none;
            transition: opacity 240ms var(--spring), transform 240ms var(--spring);
        }

        .tile > .tile-sheen {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.11) 18%, transparent 34%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 24%, transparent 72%, rgba(255, 255, 255, 0.06) 100%);
            mix-blend-mode: screen;
            opacity: 0.72;
            pointer-events: none;
            z-index: 1;
            transition: opacity 240ms var(--spring), transform 240ms var(--spring), filter 240ms var(--spring);
        }

        .tile > .tile-rim {
            position: absolute;
            inset: 1px;
            border-radius: calc(var(--radius-xl) - 1px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            pointer-events: none;
            z-index: 1;
            opacity: 0.84;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                inset 0 -1px 0 rgba(255, 255, 255, 0.04);
            transition: opacity 240ms var(--spring), box-shadow 240ms var(--spring), transform 240ms var(--spring);
        }

        .tile > .tile-glow {
            position: absolute;
            inset: auto;
            width: 220px;
            height: 220px;
            right: -72px;
            bottom: -92px;
            border-radius: 50%;
            opacity: 0.34;
            filter: blur(18px);
            pointer-events: none;
            z-index: 1;
            transition: opacity 240ms var(--spring), transform 240ms var(--spring), filter 240ms var(--spring);
        }

        .tile > .tile-press {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.14), transparent 40%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.04), transparent 28%, transparent 70%, rgba(0, 0, 0, 0.08));
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            transition: opacity 180ms var(--spring), transform 180ms var(--spring);
        }

        .tile:hover {
            transform: translateY(-7px) scale(1.018);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.4),
                inset 0 16px 26px rgba(255, 255, 255, 0.08),
                inset 0 -16px 26px rgba(71, 113, 184, 0.08),
                0 28px 54px rgba(72, 118, 192, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            filter: saturate(1.12) brightness(1.05);
            backdrop-filter: blur(22px) saturate(165%);
            -webkit-backdrop-filter: blur(22px) saturate(165%);
        }

        .tile:hover::before,
        .tile:focus-visible::before {
            opacity: 1;
            transform: translateY(-2px) scale(1.03);
        }

        .tile:hover::after,
        .tile:focus-visible::after {
            opacity: 0.9;
            transform: scale(1.08);
        }

        .tile:hover > .tile-sheen,
        .tile:focus-visible > .tile-sheen {
            opacity: 0.94;
            transform: translateY(-4px) scale(1.015);
            filter: brightness(1.08);
        }

        .tile:hover > .tile-rim,
        .tile:focus-visible > .tile-rim {
            opacity: 1;
            transform: translateY(-1px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.28),
                inset 0 -1px 0 rgba(255, 255, 255, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .tile:hover > .tile-glow,
        .tile:focus-visible > .tile-glow {
            opacity: 0.58;
            transform: scale(1.12);
            filter: blur(12px);
        }

        .tile:active {
            transform: translateY(2px) scale(0.986);
            filter: saturate(1.2) brightness(1.02);
            box-shadow:
                inset 0 4px 18px rgba(0, 0, 0, 0.08),
                inset 0 -4px 10px rgba(255, 255, 255, 0.08),
                inset 0 18px 24px rgba(255, 255, 255, 0.04),
                0 10px 18px rgba(72, 118, 192, 0.16),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(18px) saturate(172%);
            -webkit-backdrop-filter: blur(18px) saturate(172%);
        }

        .tile:active::before {
            opacity: 0.7;
            transform: translateY(2px) scale(0.995);
        }

        .tile:active::after {
            opacity: 0.68;
            transform: scale(1.04);
        }

        .tile:active > .tile-sheen {
            opacity: 0.54;
            transform: translateY(6px) scale(0.985);
            filter: brightness(0.98);
        }

        .tile:active > .tile-rim {
            opacity: 0.9;
            transform: translateY(2px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.06);
        }

        .tile:active > .tile-glow {
            opacity: 0.8;
            transform: scale(1.22);
            filter: blur(9px);
        }

        .tile:active > .tile-press {
            opacity: 1;
            transform: scale(0.99);
        }

        .tile:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.88);
            outline-offset: 4px;
        }

        .tile.tests {
            background:
                radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.26), transparent 28%),
                radial-gradient(circle at 80% 88%, rgba(154, 194, 255, 0.12), transparent 24%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08) 38%, rgba(255, 255, 255, 0.03) 100%),
                linear-gradient(135deg, rgba(83, 137, 241, 0.82), rgba(22, 47, 112, 0.68));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.34),
                inset 0 16px 24px rgba(255, 255, 255, 0.06),
                inset 0 -18px 28px rgba(27, 56, 122, 0.2),
                0 0 0 1px rgba(126, 168, 255, 0.08),
                0 20px 40px rgba(30, 71, 156, 0.26),
                0 0 48px rgba(74, 128, 255, 0.2);
        }

        .tile.blog {
            background:
                radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.28), transparent 28%),
                radial-gradient(circle at 80% 88%, rgba(240, 242, 248, 0.1), transparent 24%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.09) 38%, rgba(255, 255, 255, 0.03) 100%),
                linear-gradient(135deg, rgba(172, 185, 208, 0.62), rgba(96, 106, 129, 0.5));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.34),
                inset 0 16px 24px rgba(255, 255, 255, 0.06),
                inset 0 -18px 28px rgba(62, 69, 84, 0.16),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 20px 40px rgba(79, 88, 112, 0.2),
                0 0 42px rgba(216, 226, 255, 0.14);
        }

        .tile.workouts {
            background:
                radial-gradient(circle at 18% 16%, rgba(255, 244, 240, 0.26), transparent 28%),
                radial-gradient(circle at 80% 88%, rgba(255, 199, 182, 0.12), transparent 24%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.08) 38%, rgba(255, 255, 255, 0.03) 100%),
                linear-gradient(135deg, rgba(255, 150, 116, 0.78), rgba(203, 59, 43, 0.64));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.34),
                inset 0 16px 24px rgba(255, 255, 255, 0.06),
                inset 0 -18px 28px rgba(138, 38, 29, 0.2),
                0 0 0 1px rgba(255, 174, 146, 0.08),
                0 20px 40px rgba(181, 53, 42, 0.24),
                0 0 48px rgba(255, 126, 96, 0.2);
        }

        .tile.festudy {
            background:
                radial-gradient(circle at 18% 16%, rgba(240, 255, 252, 0.26), transparent 28%),
                radial-gradient(circle at 80% 88%, rgba(177, 255, 236, 0.12), transparent 24%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.08) 38%, rgba(255, 255, 255, 0.03) 100%),
                linear-gradient(135deg, rgba(94, 231, 193, 0.74), rgba(56, 153, 219, 0.62));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.34),
                inset 0 16px 24px rgba(255, 255, 255, 0.06),
                inset 0 -18px 28px rgba(40, 104, 137, 0.2),
                0 0 0 1px rgba(142, 255, 228, 0.08),
                0 20px 40px rgba(41, 120, 154, 0.24),
                0 0 48px rgba(80, 233, 194, 0.2);
        }

        .tile-icon {
            width: 180px;
            height: 180px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: -28px;
            bottom: -38px;
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }

        .tile-icon svg {
            width: 180px;
            height: 180px;
            stroke: currentColor;
            filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.1));
        }

        .tile-copy h2 {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.05em;
            margin-bottom: 6px;
            position: relative;
            z-index: 2;
        }

        .tile-copy p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 24ch;
            position: relative;
            z-index: 2;
        }

        .tile-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 18px;
            position: relative;
            z-index: 2;
        }

        .tile-foot span {
            color: var(--faint);
            font-size: 0.8rem;
            font-weight: 600;
        }

        @keyframes tile-in {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 760px) {
            .page {
                width: min(100% - 16px, 100%);
                padding-top: calc(18px + env(safe-area-inset-top));
            }

            .hero {
                padding: 18px 14px 6px;
            }

            .tiles-panel {
                border-radius: 30px;
                padding: 12px;
            }

            .tiles-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .tile {
                min-height: 180px;
                padding: 18px;
            }

            .tile-copy h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="sky"></div>
    <div class="flare"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <main class="page">
        <div class="shell">
            <section class="hero" aria-label="Portal heading">
                <h1>Portal</h1>
            </section>

            <section class="tiles-panel" aria-label="Portal links">
                <div class="tiles-grid">
                    <a class="tile tests" href="https://sull1van.com/tests">
                        <div class="tile-sheen" aria-hidden="true"></div>
                        <div class="tile-rim" aria-hidden="true"></div>
                        <div class="tile-press" aria-hidden="true"></div>
                        <div class="tile-glow" aria-hidden="true" style="background: radial-gradient(circle, rgba(102, 153, 255, 0.62), transparent 68%);"></div>
                        <div class="tile-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 3h6"></path>
                                <path d="M10 3v5l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3L14 8V3"></path>
                                <path d="M8.5 14h7"></path>
                            </svg>
                        </div>
                        <div class="tile-copy">
                            <h2>Tests</h2>
                            <p>Bloodwork, trends, and lab history.</p>
                        </div>
                        <div class="tile-foot">
                            <span>Open</span>
                        </div>
                    </a>

                    <a class="tile blog" href="https://sull1van.com">
                        <div class="tile-sheen" aria-hidden="true"></div>
                        <div class="tile-rim" aria-hidden="true"></div>
                        <div class="tile-press" aria-hidden="true"></div>
                        <div class="tile-glow" aria-hidden="true" style="background: radial-gradient(circle, rgba(233, 238, 255, 0.48), transparent 68%);"></div>
                        <div class="tile-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 4h8l4 4v12H6z"></path>
                                <path d="M14 4v4h4"></path>
                                <path d="M9 13h6"></path>
                                <path d="M9 17h6"></path>
                            </svg>
                        </div>
                        <div class="tile-copy">
                            <h2>Blog</h2>
                            <p>Main site, posts, and public writing.</p>
                        </div>
                        <div class="tile-foot">
                            <span>Open</span>
                        </div>
                    </a>

                    <a class="tile workouts" href="https://sull1van.com/workouts">
                        <div class="tile-sheen" aria-hidden="true"></div>
                        <div class="tile-rim" aria-hidden="true"></div>
                        <div class="tile-press" aria-hidden="true"></div>
                        <div class="tile-glow" aria-hidden="true" style="background: radial-gradient(circle, rgba(255, 137, 110, 0.64), transparent 68%);"></div>
                        <div class="tile-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 10v4"></path>
                                <path d="M20 10v4"></path>
                                <path d="M7 8v8"></path>
                                <path d="M17 8v8"></path>
                                <path d="M4 12h16"></path>
                            </svg>
                        </div>
                        <div class="tile-copy">
                            <h2>Workouts</h2>
                            <p>Training logs, body metrics, and fitness tools.</p>
                        </div>
                        <div class="tile-foot">
                            <span>Open</span>
                        </div>
                    </a>

                    <a class="tile festudy" href="https://sull1van.com/FEStudy">
                        <div class="tile-sheen" aria-hidden="true"></div>
                        <div class="tile-rim" aria-hidden="true"></div>
                        <div class="tile-press" aria-hidden="true"></div>
                        <div class="tile-glow" aria-hidden="true" style="background: radial-gradient(circle, rgba(93, 238, 202, 0.62), transparent 68%);"></div>
                        <div class="tile-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3z"></path>
                                <path d="M8 20V7a3 3 0 0 1 3-3"></path>
                                <path d="M11 9h4"></path>
                                <path d="M11 13h4"></path>
                            </svg>
                        </div>
                        <div class="tile-copy">
                            <h2>FEStudy</h2>
                            <p>Study materials and exam-prep resources.</p>
                        </div>
                        <div class="tile-foot">
                            <span>Open</span>
                        </div>
                    </a>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
