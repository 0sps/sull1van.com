<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B9CT2XT2ME"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-B9CT2XT2ME');
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Portal | Sean's Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --text: rgba(255, 255, 255, 0.96);
            --muted: rgba(255, 255, 255, 0.76);
            --faint: rgba(255, 255, 255, 0.58);
            --line: rgba(255, 255, 255, 0.18);
            --line-strong: rgba(255, 255, 255, 0.28);
            --glass: rgba(89, 142, 219, 0.24);
            --glass-strong: rgba(79, 128, 202, 0.34);
            --shadow: 0 28px 70px rgba(34, 74, 138, 0.24);
            --shadow-soft: 0 18px 40px rgba(34, 74, 138, 0.16);
            --pill: 999px;
            --radius-xl: 34px;
            --radius-l: 26px;
            --spring: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;
            background:
                radial-gradient(circle at 54% 42%, rgba(255, 246, 218, 0.42), rgba(255, 246, 218, 0.12) 10%, transparent 22%),
                radial-gradient(circle at 50% 48%, rgba(173, 211, 255, 0.4), transparent 28%),
                radial-gradient(circle at 28% 52%, rgba(191, 222, 255, 0.14), transparent 24%),
                radial-gradient(circle at 74% 56%, rgba(174, 212, 255, 0.16), transparent 26%),
                linear-gradient(
                    180deg,
                    #ffffff 0,
                    #ffffff 6vh,
                    #f8fbff 9vh,
                    #e4f0ff 18vh,
                    #dcecff 43%,
                    #d9ebff 57%,
                    #e4f0ff calc(100% - 18vh),
                    #f8fbff calc(100% - 9vh),
                    #ffffff calc(100% - 6vh),
                    #ffffff 100%
                );
            background-color: #ffffff;
        }

        body {
            min-height: 100dvh;
            color: var(--text);
            font-family: var(--font-body);
            overflow-x: hidden;
            position: relative;
        }

        .sky,
        .vignette,
        .grain,
        .flare {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .sky {
            z-index: -4;
            background:
                radial-gradient(circle at 50% 48%, rgba(116, 182, 255, 0.18), transparent 30%),
                radial-gradient(circle at 34% 60%, rgba(255, 255, 255, 0.12), transparent 18%);
        }

        .flare {
            z-index: -3;
            background:
                radial-gradient(circle at 54% 42%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.18) 9%, transparent 20%),
                radial-gradient(circle at 58% 50%, rgba(255, 255, 255, 0.14), transparent 4%),
                radial-gradient(circle at 46% 56%, rgba(255, 255, 255, 0.1), transparent 5%);
            filter: blur(2px);
            opacity: 0.8;
        }

        .vignette {
            z-index: -2;
            background: radial-gradient(circle at 50% 50%, transparent 52%, rgba(119, 162, 223, 0.08) 100%);
        }

        .grain {
            z-index: -1;
            opacity: 0.035;
            mix-blend-mode: soft-light;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.68' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .page {
            width: min(980px, calc(100% - 26px));
            margin: 0 auto;
            padding: calc(28px + env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom));
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shell {
            width: 100%;
            display: grid;
            gap: 20px;
        }

        .hero {
            text-align: left;
            padding: 28px 20px 8px;
            text-shadow: 0 2px 18px rgba(255, 255, 255, 0.18);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: clamp(3rem, 8vw, 5.8rem);
            line-height: 0.92;
            letter-spacing: -0.07em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .tiles-panel {
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
            padding: 16px;
            border-radius: 38px;
            background: linear-gradient(180deg, rgba(132, 178, 236, 0.08), rgba(101, 149, 220, 0.04));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1.5px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 10px 24px rgba(65, 108, 177, 0.08);
        }

        .tiles-grid {
            --tile-width: 306px;
            display: grid;
            grid-template-columns: repeat(2, var(--tile-width));
            gap: 16px;
        }

        .tile {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
            padding: 22px;
            width: 100%;
            border-radius: var(--radius-xl);
            color: var(--text);
            text-decoration: none;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08)),
                linear-gradient(180deg, rgba(120, 170, 236, 0.46), rgba(72, 122, 204, 0.38));
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-top: 1.5px solid rgba(255, 255, 255, 0.3);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.26),
                inset 0 12px 18px rgba(255, 255, 255, 0.03),
                inset 0 -14px 22px rgba(58, 98, 165, 0.14),
                0 14px 28px rgba(72, 118, 192, 0.16);
            overflow: hidden;
            transform: translateY(18px) scale(0.985);
            opacity: 0;
            animation: tile-in 620ms var(--spring) forwards;
            transition:
                transform 240ms var(--spring),
                box-shadow 240ms var(--spring),
                filter 240ms var(--spring),
                background 240ms var(--spring),
                border-color 240ms var(--spring);
        }

        .tile:nth-child(2) { animation-delay: 90ms; }
        .tile:nth-child(3) { animation-delay: 180ms; }
        .tile:nth-child(4) { animation-delay: 270ms; }
        .tile::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), transparent 40%);
            pointer-events: none;
            transition: opacity 240ms var(--spring), transform 240ms var(--spring);
        }

        .tile:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 12px 18px rgba(255, 255, 255, 0.04),
                inset 0 -12px 20px rgba(71, 113, 184, 0.1),
                0 18px 32px rgba(72, 118, 192, 0.2);
            filter: saturate(1.06) brightness(1.03);
        }

        .tile:hover::before,
        .tile:focus-visible::before {
            opacity: 1;
            transform: scale(1.02);
        }

        .tile:active {
            transform: translateY(1px) scale(0.99);
            filter: saturate(1.08) brightness(1.01);
            box-shadow:
                inset 0 3px 12px rgba(0, 0, 0, 0.06),
                inset 0 -4px 8px rgba(255, 255, 255, 0.05),
                0 8px 16px rgba(72, 118, 192, 0.12);
        }

        .tile:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.88);
            outline-offset: 4px;
        }

        .tile.tests {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.09)),
                linear-gradient(135deg, rgba(76, 129, 232, 0.78), rgba(18, 40, 98, 0.66));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.26),
                inset 0 12px 18px rgba(255, 255, 255, 0.03),
                inset 0 -14px 22px rgba(27, 56, 122, 0.16),
                0 14px 28px rgba(30, 71, 156, 0.18);
        }

        .tile.blog {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.09)),
                linear-gradient(135deg, rgba(156, 170, 192, 0.6), rgba(88, 97, 116, 0.5));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.26),
                inset 0 12px 18px rgba(255, 255, 255, 0.03),
                inset 0 -14px 22px rgba(62, 69, 84, 0.14),
                0 14px 28px rgba(79, 88, 112, 0.14);
        }

        .tile.workouts {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.09)),
                linear-gradient(135deg, rgba(255, 134, 98, 0.74), rgba(193, 54, 39, 0.64));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.26),
                inset 0 12px 18px rgba(255, 255, 255, 0.03),
                inset 0 -14px 22px rgba(138, 38, 29, 0.16),
                0 14px 28px rgba(181, 53, 42, 0.16);
        }

        .tile.festudy {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.09)),
                linear-gradient(135deg, rgba(88, 220, 184, 0.7), rgba(52, 145, 206, 0.62));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.26),
                inset 0 12px 18px rgba(255, 255, 255, 0.03),
                inset 0 -14px 22px rgba(40, 104, 137, 0.16),
                0 14px 28px rgba(41, 120, 154, 0.16);
        }

        .tile-icon {
            width: 180px;
            height: 180px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: -28px;
            bottom: -38px;
            z-index: 0;
            opacity: 0.26;
            pointer-events: none;
        }

        .tile-icon svg {
            width: 180px;
            height: 180px;
            stroke: currentColor;
        }

        .tile-copy h2 {
            font-family: var(--font-heading);
            font-size: 2.85rem;
            font-weight: 600;
            letter-spacing: -0.05em;
            margin-bottom: 0;
            position: relative;
            z-index: 2;
            line-height: 0.94;
        }

        .tile-copy p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 24ch;
            position: relative;
            z-index: 2;
        }

        .tile-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 18px;
            position: relative;
            z-index: 2;
        }

        .tile-foot span {
            display: inline-flex;
            align-items: center;
            min-height: 34px;
            padding: 0 14px;
            border-radius: var(--pill);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.94rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 6px 14px rgba(65, 108, 177, 0.08);
        }

        @keyframes tile-in {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 760px) {
            .page {
                width: min(100% - 16px, 100%);
                padding-top: calc(18px + env(safe-area-inset-top));
            }

            .hero {
                padding: 18px 14px 6px;
            }

            .tiles-panel {
                width: 100%;
                border-radius: 30px;
                padding: 12px;
            }

            .tiles-grid {
                --tile-width: 100%;
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .tile {
                width: 100%;
                min-height: 180px;
                padding: 18px;
            }

            .tile-copy h2 {
                font-size: 2.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="sky"></div>
    <div class="flare"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <main class="page">
        <div class="shell">
            <section class="hero" aria-label="Portal heading">
                <h1>Portal</h1>
            </section>

            <section class="tiles-panel" aria-label="Portal links">
                <div class="tiles-grid">
                    <a class="tile tests" href="https://sull1van.com/labs">
                        <div class="tile-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 3h6"></path>
                                <path d="M10 3v5l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3L14 8V3"></path>
                                <path d="M8.5 14h7"></path>
                            </svg>
                        </div>
                        <div class="tile-copy">
                            <h2>Tests</h2>
                        </div>
                        <div class="tile-foot">
                            <span>Open</span>
                        </div>
                    </a>

                    <a class="tile blog" href="https://sull1van.com">
                        <div class="tile-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 4h8l4 4v12H6z"></path>
                                <path d="M14 4v4h4"></path>
                                <path d="M9 13h6"></path>
                                <path d="M9 17h6"></path>
                            </svg>
                        </div>
                        <div class="tile-copy">
                            <h2>Blog</h2>
                        </div>
                        <div class="tile-foot">
                            <span>Open</span>
                        </div>
                    </a>

                    <a class="tile workouts" href="https://sull1van.com/workouts">
                        <div class="tile-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 10v4"></path>
                                <path d="M20 10v4"></path>
                                <path d="M7 8v8"></path>
                                <path d="M17 8v8"></path>
                                <path d="M4 12h16"></path>
                            </svg>
                        </div>
                        <div class="tile-copy">
                            <h2>Workouts</h2>
                        </div>
                        <div class="tile-foot">
                            <span>Open</span>
                        </div>
                    </a>

                    <a class="tile festudy" href="https://sull1van.com/FEStudy">
                        <div class="tile-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3z"></path>
                                <path d="M8 20V7a3 3 0 0 1 3-3"></path>
                                <path d="M11 9h4"></path>
                                <path d="M11 13h4"></path>
                            </svg>
                        </div>
                        <div class="tile-copy">
                            <h2>FEStudy</h2>
                        </div>
                        <div class="tile-foot">
                            <span>Open</span>
                        </div>
                    </a>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
